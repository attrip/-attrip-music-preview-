<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Music</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:980px;margin:auto;display:grid;gap:20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;opacity:.6}h1{margin:0;font-size:clamp(34px,6vw,64px)}.controls{display:flex;gap:8px;flex-wrap:wrap}select{font:inherit;color:inherit;padding:11px 14px;border:1px solid currentColor;border-radius:12px;background:transparent}.hint{font-size:14px;opacity:.7}.pads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.pad{min-height:150px;border:1px solid currentColor;border-radius:18px;background:transparent;color:inherit;cursor:pointer;display:grid;place-items:center;padding:14px}.pad[data-active=true]{transform:translateY(4px) scale(.98);background:color-mix(in srgb,currentColor 12%,transparent)}.chord-name{font-size:clamp(24px,3vw,38px);font-weight:850}.key-label{margin-top:18px;font-size:13px;opacity:.5}.degree{font-size:12px;opacity:.45;margin-bottom:6px}.mode{font-size:13px;opacity:.7}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:44px;align-items:center}.progression span{padding:7px 11px;border:1px solid currentColor;border-radius:999px}.shift-on .pad .base{display:none}.pad .seventh{display:none}.shift-on .pad .seventh{display:block}@media(max-width:760px){.pads{grid-template-columns:repeat(4,1fr)}.pad{min-height:110px}}@media(max-width:480px){body{padding:16px}.pads{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app" id="app"><div><div class="eyebrow">ATTRIP / MUSIC PREVIEW</div><h1>コードを、触る。</h1><p id="meta"></p></div><div class="controls"><select id="key"></select><select id="scale"><option value="major">Major</option><option value="minor">Natural Minor</option></select><select id="sound"><option value="ep">Electric Piano</option><option value="piano">Soft Piano</option><option value="pad">Warm Pad</option></select></div><div class="hint">画面をクリック、または A S D F G H J。Shift中は7th。音色も切り替えられます。</div><div class="pads" id="pads"></div><div class="mode" id="mode">基本コード / Electric Piano</div><div class="progression" id="progression">コードを弾くと進行が残ります。</div></main><script>const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],S={major:{i:[0,2,4,5,7,9,11],q:['maj','min','min','maj','maj','min','dim'],s:['maj7','min7','min7','maj7','7','min7','m7b5']},minor:{i:[0,2,3,5,7,8,10],q:['min','dim','maj','min','min','maj','maj'],s:['min7','m7b5','maj7','min7','min7','maj7','7']}},T={maj:[0,4,7],min:[0,3,7],dim:[0,3,6],maj7:[0,4,7,11],min7:[0,3,7,10],'7':[0,4,7,10],m7b5:[0,3,6,10]},CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],LABELS=['A','S','D','F','G','H','J'],DEGREES=['I','II','III','IV','V','VI','VII'];let audio,master,delay,feedback,cur=[],sel=[],shift=false;const app=document.querySelector('#app'),key=document.querySelector('#key'),scale=document.querySelector('#scale'),sound=document.querySelector('#sound'),pads=document.querySelector('#pads'),prog=document.querySelector('#progression'),meta=document.querySelector('#meta'),mode=document.querySelector('#mode');N.forEach(n=>key.add(new Option(n,n)));function lab(r,q){return q==='min'?r+'m':q==='dim'?r+'dim':q==='maj7'?r+'maj7':q==='min7'?r+'m7':q==='m7b5'?r+'m7♭5':q==='7'?r+'7':r}function build(){let r=N.indexOf(key.value),s=S[scale.value];cur=s.i.map((v,d)=>{let a=r+v;return{root:N[a%12],tri:s.q[d],sev:s.s[d],base:60+a}});sel=[];draw();render()}function notes(c,q){return T[q].map(x=>c.base+x)}async function ensureAudio(){if(!audio){audio=new(window.AudioContext||window.webkitAudioContext)();master=audio.createDynamicsCompressor();master.threshold.value=-20;master.knee.value=18;master.ratio.value=3;master.attack.value=.01;master.release.value=.28;delay=audio.createDelay(.6);delay.delayTime.value=.19;feedback=audio.createGain();feedback.gain.value=.18;delay.connect(feedback).connect(delay);delay.connect(master);master.connect(audio.destination)}if(audio.state==='suspended')await audio.resume();return audio}function voice(a,m,when,type,dur,vol,detune=0){let o=a.createOscillator(),g=a.createGain(),f=a.createBiquadFilter();o.type=type;o.frequency.value=440*Math.pow(2,(m-69)/12);o.detune.value=detune;f.type='lowpass';f.frequency.value=sound.value==='pad'?1800:4200;f.Q.value=.5;let attack=sound.value==='pad'?.12:.008,release=sound.value==='pad'?2.6:1.35;g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+attack);g.gain.exponentialRampToValueAtTime(.0001,when+dur+release);o.connect(f).connect(g);g.connect(master);g.connect(delay);o.start(when);o.stop(when+dur+release+.05)}async function play(ns){const a=await ensureAudio(),t=a.currentTime+.005;ns.forEach((m,i)=>{if(sound.value==='ep'){voice(a,m,t,'sine',.48,.07);voice(a,m+12,t,'sine',.28,.018);voice(a,m,t,'triangle',.35,.025,4)}else if(sound.value==='piano'){voice(a,m,t,'triangle',.34,.085);voice(a,m+12,t,'sine',.18,.018)}else{voice(a,m,t,'sawtooth',1.0,.026,-5);voice(a,m,t,'triangle',1.1,.035,5)}})}function hit(i,seventh=shift){let c=cur[i];if(!c)return;let q=seventh?c.sev:c.tri,l=lab(c.root,q);play(notes(c,q));sel.push(l);if(sel.length>12)sel.shift();draw();let b=pads.children[i];if(b){b.dataset.active='true';setTimeout(()=>b.dataset.active='false',130)}}function render(){meta.textContent=key.value+' / '+scale.options[scale.selectedIndex].text;pads.replaceChildren(...cur.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<span><div class="degree">'+DEGREES[i]+'</div><div class="chord-name base">'+lab(c.root,c.tri)+'</div><div class="chord-name seventh">'+lab(c.root,c.sev)+'</div><div class="key-label">KEY '+LABELS[i]+'</div></span>';b.onpointerdown=e=>{e.preventDefault();hit(i,e.shiftKey||shift)};return b}))}function draw(){if(!sel.length){prog.textContent='コードを弾くと進行が残ります。';return}prog.replaceChildren(...sel.map(x=>{let s=document.createElement('span');s.textContent=x;return s}))}function status(){mode.textContent=(shift?'7thコード':'基本コード')+' / '+sound.options[sound.selectedIndex].text}function setShift(v){shift=v;app.classList.toggle('shift-on',v);status()}key.value='C';key.onchange=build;scale.onchange=build;sound.onchange=status;document.addEventListener('keydown',e=>{if(e.key==='Shift')setShift(true);if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();hit(i,e.shiftKey)}});document.addEventListener('keyup',e=>{if(e.key==='Shift')setShift(false)});window.addEventListener('blur',()=>setShift(false));build();status();</script></body></html>
