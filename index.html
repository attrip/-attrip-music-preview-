<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Music</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:920px;margin:auto;display:grid;gap:18px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;opacity:.6}h1{margin:0;font-size:clamp(30px,6vw,58px)}.controls{display:flex;gap:8px;flex-wrap:wrap}select{font:inherit;color:inherit;padding:10px;border:1px solid currentColor;border-radius:12px;background:transparent}.hint{font-size:13px;opacity:.7}.piano-wrap{overflow-x:auto;padding-bottom:4px}.piano{position:relative;display:flex;min-width:700px;height:230px;user-select:none}.white-key{position:relative;flex:1;border:1px solid #444;border-right:0;background:#fff;color:#111;cursor:pointer;padding:0 6px 14px;display:flex;align-items:flex-end;justify-content:center;text-align:center}.white-key:first-child{border-radius:10px 0 0 10px}.white-key:last-child{border-right:1px solid #444;border-radius:0 10px 10px 0}.white-key[data-active=true]{background:#ddd;transform:translateY(3px)}.white-key .name{font-size:18px;font-weight:800;line-height:1.1}.white-key kbd{display:block;margin-top:7px;font-size:12px;opacity:.55}.black-key{position:absolute;top:0;width:8.5%;height:62%;background:#111;border:1px solid #000;border-radius:0 0 7px 7px;z-index:4;pointer-events:none;box-shadow:0 3px 5px rgba(0,0,0,.35)}.b1{left:9.9%}.b2{left:24.1%}.b3{left:52.7%}.b4{left:66.9%}.b5{left:81.2%}.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;opacity:.72}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:42px;align-items:center}.progression span{padding:6px 10px;border:1px solid currentColor;border-radius:999px}@media(max-width:650px){body{padding:16px}.piano{min-width:620px;height:190px}.white-key .name{font-size:16px}}</style></head><body><main class="app"><div><div class="eyebrow">ATTRIP / MUSIC PREVIEW</div><h1>コードを、触る。</h1><p id="meta"></p></div><div class="controls"><select id="key" aria-label="キー"></select><select id="scale" aria-label="スケール"><option value="major">Major</option><option value="minor">Natural Minor</option></select></div><div class="hint">A S D F G H J を、左から右の白鍵として使います。日本語入力中でも物理キー位置で反応します。</div><div class="piano-wrap"><div class="piano" id="piano"><span class="black-key b1"></span><span class="black-key b2"></span><span class="black-key b3"></span><span class="black-key b4"></span><span class="black-key b5"></span></div></div><div class="legend"><span>A–J = 基本コード</span><span>Shift + A–J = 7th</span><span>画面の白鍵をクリックしても鳴ります</span></div><div class="progression" id="progression">コードを弾くと進行が残ります。</div></main><script>const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],S={major:{i:[0,2,4,5,7,9,11],q:['maj','min','min','maj','maj','min','dim'],s:['maj7','min7','min7','maj7','7','min7','m7b5']},minor:{i:[0,2,3,5,7,8,10],q:['min','dim','maj','min','min','maj','maj'],s:['min7','m7b5','maj7','min7','min7','maj7','7']}},T={maj:[0,4,7],min:[0,3,7],dim:[0,3,6],maj7:[0,4,7,11],min7:[0,3,7,10],'7':[0,4,7,10],m7b5:[0,3,6,10]},CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],LABELS=['A','S','D','F','G','H','J'];let audio,cur=[],sel=[];const key=document.querySelector('#key'),scale=document.querySelector('#scale'),piano=document.querySelector('#piano'),prog=document.querySelector('#progression'),meta=document.querySelector('#meta');N.forEach(n=>key.add(new Option(n,n)));function lab(r,q){return q==='min'?r+'m':q==='dim'?r+'dim':q==='maj7'?r+'maj7':q==='min7'?r+'m7':q==='m7b5'?r+'m7♭5':q==='7'?r+'7':r}function build(){let r=N.indexOf(key.value),s=S[scale.value];cur=s.i.map((v,d)=>{let a=r+v;return{root:N[a%12],tri:s.q[d],sev:s.s[d],base:60+a}});sel=[];draw();render()}function notes(c,q){return T[q].map(x=>c.base+x)}async function ensureAudio(){audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')await audio.resume();return audio}async function play(ns){const a=await ensureAudio(),t=a.currentTime;ns.forEach((m,i)=>{let o=a.createOscillator(),g=a.createGain();o.type=i?'sine':'triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.07,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.95);o.connect(g).connect(a.destination);o.start(t);o.stop(t+.98)})}function hit(i,seventh=false){let c=cur[i];if(!c)return;let q=seventh?c.sev:c.tri,l=lab(c.root,q);play(notes(c,q));sel.push(l);if(sel.length>12)sel.shift();draw();let b=piano.querySelectorAll('.white-key')[i];if(b){b.dataset.active='true';setTimeout(()=>b.dataset.active='false',130)}}function render(){meta.textContent=key.value+' / '+scale.options[scale.selectedIndex].text;piano.querySelectorAll('.white-key').forEach(n=>n.remove());cur.forEach((c,i)=>{let b=document.createElement('button');b.className='white-key';b.type='button';b.innerHTML='<span><span class="name">'+lab(c.root,c.tri)+'</span><kbd>'+LABELS[i]+'</kbd></span>';b.addEventListener('pointerdown',e=>{e.preventDefault();hit(i,e.shiftKey)});piano.appendChild(b)})}function draw(){if(!sel.length){prog.textContent='コードを弾くと進行が残ります。';return}prog.replaceChildren(...sel.map(x=>{let s=document.createElement('span');s.textContent=x;return s}))}key.value='C';key.onchange=build;scale.onchange=build;document.addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();hit(i,e.shiftKey)}});build();</script></body></html>
