<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Music Funk Lab</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:1000px;margin:auto;display:grid;gap:18px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;opacity:.6}h1{margin:0;font-size:clamp(36px,6vw,68px)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:12px;padding:10px}.play{font-weight:850;min-width:130px}.play[data-on=true]{background:currentColor;color:Canvas}.hint,.status{font-size:13px;opacity:.72}.pads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.pad{min-height:145px;border:1px solid currentColor;border-radius:18px;background:transparent;color:inherit;cursor:pointer;padding:14px}.pad[data-active=true]{transform:translateY(4px) scale(.98);background:color-mix(in srgb,currentColor 13%,transparent)}.chord-name{font-size:clamp(24px,3vw,38px);font-weight:850}.degree{font-size:12px;opacity:.45}.key-label{margin-top:18px;font-size:13px;opacity:.5}.shift-on .base{display:none}.seventh{display:none}.shift-on .seventh{display:block}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:44px;align-items:center}.progression span{padding:7px 11px;border:1px solid currentColor;border-radius:999px}.meter{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.step{height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent)}.step.on{background:currentColor}@media(max-width:760px){.pads{grid-template-columns:repeat(4,1fr)}.pad{min-height:105px}}@media(max-width:480px){body{padding:14px}.pads{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app" id="app"><div><div class="eyebrow">ATTRIP / FUNK LAB</div><h1>コードで、グルーヴを動かす。</h1><p id="meta"></p></div><div class="controls"><button class="play" id="groove">▶ GROOVE</button><select id="key"></select><select id="scale"><option value="minor">Natural Minor</option><option value="major">Major</option></select><label>BPM <input id="bpm" type="number" min="75" max="135" value="108" style="width:64px"></label><label>FUNK <input id="swing" type="range" min="0" max="100" value="64"></label></div><div class="hint">まず GROOVE をON。A S D F G H Jでコードを変えると、Rhodes風コードとベースがその場で追従します。Shift中は7th。</div><div class="pads" id="pads"></div><div class="status" id="status"></div><div class="meter" id="meter"></div><div class="progression" id="progression">コードを弾くと進行が残ります。</div></main><script>const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],S={major:{i:[0,2,4,5,7,9,11],q:['maj','min','min','maj','maj','min','dim'],s:['maj7','min7','min7','maj7','7','min7','m7b5']},minor:{i:[0,2,3,5,7,8,10],q:['min','dim','maj','min','min','maj','maj'],s:['min7','m7b5','maj7','min7','min7','maj7','7']}},T={maj:[0,4,7],min:[0,3,7],dim:[0,3,6],maj7:[0,4,7,11],min7:[0,3,7,10],'7':[0,4,7,10],m7b5:[0,3,6,10]},CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],LABELS=['A','S','D','F','G','H','J'],DEG=['I','II','III','IV','V','VI','VII'];let ac,master,cur=[],sel=[],shift=false,running=false,timer=null,step=0,nextTime=0,currentChord=null;const $=s=>document.querySelector(s),app=$('#app'),key=$('#key'),scale=$('#scale'),bpm=$('#bpm'),swing=$('#swing'),pads=$('#pads'),prog=$('#progression'),meta=$('#meta'),status=$('#status'),groove=$('#groove'),meter=$('#meter');N.forEach(n=>key.add(new Option(n,n)));for(let i=0;i<16;i++){let s=document.createElement('span');s.className='step';meter.appendChild(s)}function lab(r,q){return q==='min'?r+'m':q==='dim'?r+'dim':q==='maj7'?r+'maj7':q==='min7'?r+'m7':q==='m7b5'?r+'m7♭5':q==='7'?r+'7':r}function build(){let r=N.indexOf(key.value),s=S[scale.value];cur=s.i.map((v,d)=>{let a=r+v;return{root:N[a%12],tri:s.q[d],sev:s.s[d],base:60+a}});currentChord=cur[0];sel=[];draw();render()}function notes(c,q){return T[q].map(x=>c.base+x)}async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-18;master.ratio.value=4;master.connect(ac.destination)}if(ac.state==='suspended')await ac.resume();return ac}function osc(freq,t,dur,type='sine',vol=.08,dest=master){let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=freq;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g).connect(dest);o.start(t);o.stop(t+dur+.02)}function noise(t,dur,vol=.06,hp=1800){let b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);src.connect(f).connect(g).connect(master);src.start(t);src.stop(t+dur)}function kick(t){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(115,t);o.frequency.exponentialRampToValueAtTime(42,t+.13);g.gain.setValueAtTime(.34,t);g.gain.exponentialRampToValueAtTime(.0001,t+.22);o.connect(g).connect(master);o.start(t);o.stop(t+.24)}function snare(t){noise(t,.12,.16,900);osc(180,t,.09,'triangle',.07)}function hat(t,open=false){noise(t,open?.13:.045,open?.055:.038,5200)}function bass(t,m,accent=false){let f=440*Math.pow(2,(m-69)/12);osc(f,t,accent?.24:.15,'sawtooth',accent?.11:.075)}function rhodes(t,c,seventh=true,stab=.28){let q=seventh?c.sev:c.tri;notes(c,q).forEach((m,i)=>{let f=440*Math.pow(2,(m-69)/12);osc(f,t,stab,'sine',.035);osc(f*2,t,stab*.65,'sine',.008)})}function schedule(s,t){let funky=Number(swing.value)/100,off=(s%2?funky*.035:0),tt=t+off;if([0,6,10].includes(s))kick(tt);if([4,12].includes(s))snare(tt);hat(tt,s===7||s===15);if(s%2===0)hat(tt+.01,false);if(currentChord){let root=currentChord.base-24;if([0,3,6,10,14].includes(s)){let offs={0:0,3:7,6:12,10:7,14:10}[s];bass(tt,root+offs,s===0)}if([2,7,11,15].includes(s))rhodes(tt,currentChord,true,s===15?.42:.22)}}function scheduler(){if(!running)return;let sixteenth=60/Number(bpm.value)/4;while(nextTime<ac.currentTime+.12){schedule(step,nextTime);let visual=step;setTimeout(()=>{[...meter.children].forEach((x,i)=>x.classList.toggle('on',i===visual))},Math.max(0,(nextTime-ac.currentTime)*1000));nextTime+=sixteenth;step=(step+1)%16}timer=setTimeout(scheduler,25)}async function toggle(){await audio();running=!running;groove.dataset.on=running;groove.textContent=running?'■ STOP':'▶ GROOVE';if(running){step=0;nextTime=ac.currentTime+.06;scheduler()}else{clearTimeout(timer);[...meter.children].forEach(x=>x.classList.remove('on'))}updateStatus()}async function hit(i,seventh=shift){await audio();let c=cur[i];if(!c)return;currentChord=c;let q=seventh?c.sev:c.tri,l=lab(c.root,q);rhodes(ac.currentTime+.005,c,seventh,.75);bass(ac.currentTime+.005,c.base-24,true);sel.push(l);if(sel.length>12)sel.shift();draw();let b=pads.children[i];b.dataset.active='true';setTimeout(()=>b.dataset.active='false',130);updateStatus()}function render(){meta.textContent=key.value+' / '+scale.options[scale.selectedIndex].text;pads.replaceChildren(...cur.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<div class="degree">'+DEG[i]+'</div><div class="chord-name base">'+lab(c.root,c.tri)+'</div><div class="chord-name seventh">'+lab(c.root,c.sev)+'</div><div class="key-label">'+LABELS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();hit(i,e.shiftKey||shift)};return b}))}function draw(){if(!sel.length){prog.textContent='コードを弾くと進行が残ります。';return}prog.replaceChildren(...sel.map(x=>{let s=document.createElement('span');s.textContent=x;return s}))}function updateStatus(){status.textContent=(running?'Groove ON':'Groove OFF')+' / '+bpm.value+' BPM / '+(currentChord?lab(currentChord.root,shift?currentChord.sev:currentChord.tri):'')}function setShift(v){shift=v;app.classList.toggle('shift-on',v);updateStatus()}groove.onclick=toggle;key.value='C';key.onchange=build;scale.onchange=build;bpm.onchange=updateStatus;swing.oninput=updateStatus;document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.key==='Shift')setShift(true);if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();hit(i,e.shiftKey)}});document.addEventListener('keyup',e=>{if(e.key==='Shift')setShift(false)});window.addEventListener('blur',()=>setShift(false));build();updateStatus();</script></body></html>
