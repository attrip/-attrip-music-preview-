<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Jazz Funk Keys</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:1000px;margin:auto;display:grid;gap:18px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;opacity:.6}h1{margin:0;font-size:clamp(36px,6vw,68px)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:12px;padding:10px}.play{font-weight:850}.play[data-on=true]{background:currentColor;color:Canvas}.hint,.status{font-size:13px;opacity:.72}.pads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.pad{min-height:145px;border:1px solid currentColor;border-radius:18px;background:transparent;color:inherit;cursor:pointer}.pad[data-active=true]{background:color-mix(in srgb,currentColor 14%,transparent)}.pad[data-queued=true]{outline:3px solid currentColor;outline-offset:-5px}.chord-name{font-size:clamp(22px,3vw,36px);font-weight:850}.voicing{font-size:11px;opacity:.55;margin-top:8px}.key-label{font-size:12px;opacity:.48;margin-top:16px}.meter{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.step{height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent)}.step.on{background:currentColor}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:42px}.progression span{padding:7px 11px;border:1px solid currentColor;border-radius:999px}@media(max-width:760px){.pads{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){body{padding:14px}.pads{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><div><div class="eyebrow">ATTRIP / JAZZ KEYS ENGINE v0.5</div><h1>押した瞬間、もうジャズ。</h1><p>Rootless voicing + voice leading + humanized electric piano</p></div><div class="controls"><button class="play" id="groove">▶ GROOVE</button><label>BPM <input id="bpm" type="number" min="80" max="125" value="102" style="width:62px"></label><label>POCKET <input id="pocket" type="range" min="0" max="100" value="70"></label><label>KEYS <input id="keysLevel" type="range" min="60" max="160" value="125"></label></div><div class="hint">Bassがルートを担当し、Keysは3rd / 7th / 9th / 13th中心。A S D F G H Jで予約し、次の拍で自然に移ります。鍵盤音は完全同時ではなく数msずらして弾きます。</div><div class="pads" id="pads"></div><div class="status" id="status"></div><div class="meter" id="meter"></div><div class="progression" id="progression">コード履歴</div></main><script>const CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],KEYS=['A','S','D','F','G','H','J'];const CH=[{n:'Dm9',r:38,v:[53,57,60,64],vn:'F A C E'},{n:'G13',r:43,v:[53,59,64,69],vn:'F B E A'},{n:'Cmaj9',r:36,v:[52,59,62,67],vn:'E B D G'},{n:'A7♯9',r:45,v:[55,61,63,67],vn:'G C# C G'},{n:'Em9',r:40,v:[55,59,62,66],vn:'G B D F#'},{n:'A13',r:45,v:[55,61,66,71],vn:'G C# F# B'},{n:'Fmaj9',r:41,v:[52,57,60,67],vn:'E A C G'}];let ac,master,keysBus,bassBus,running=false,timer,step=0,nextTime=0,current=0,queued=null,history=[],lastVoicing=CH[0].v;const $=s=>document.querySelector(s),groove=$('#groove'),bpm=$('#bpm'),pocket=$('#pocket'),keysLevel=$('#keysLevel'),pads=$('#pads'),status=$('#status'),meter=$('#meter'),prog=$('#progression');for(let i=0;i<16;i++){let x=document.createElement('span');x.className='step';meter.appendChild(x)}function hz(m){return 440*Math.pow(2,(m-69)/12)}async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-18;master.knee.value=12;master.ratio.value=3;master.attack.value=.012;master.release.value=.3;master.connect(ac.destination);keysBus=ac.createGain();keysBus.gain.value=1.25;keysBus.connect(master);bassBus=ac.createGain();bassBus.gain.value=1.05;bassBus.connect(master)}if(ac.state==='suspended')await ac.resume()}function synth(m,t,dur,type,vol,dest=master,cut=8000,attack=.004){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(dest);o.start(t);o.stop(t+dur+.03)}function noise(t,dur,vol,hp){let b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur)}function kick(t,v=1){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(118,t);o.frequency.exponentialRampToValueAtTime(43,t+.12);g.gain.setValueAtTime(.31*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(master);o.start(t);o.stop(t+.22)}function snare(t,v=1){noise(t,.11,.13*v,950)}function hat(t,v=.6){noise(t,.033,.03*v,5900)}function bass(t,m,accent=false){let v=accent?.15:.105;synth(m,t,accent?.22:.14,'square',v,bassBus,600);synth(m,t,accent?.2:.13,'sine',v*.75,bassBus,420)}function closest(raw){let candidates=raw.map(n=>[n-12,n,n+12]);let best=null,bestScore=1e9;function walk(i,a){if(i===candidates.length){let s=a.reduce((sum,n)=>sum+Math.min(...lastVoicing.map(x=>Math.abs(x-n))),0)+(Math.max(...a)-Math.min(...a)>18?8:0);if(s<bestScore){bestScore=s;best=[...a]}return}for(let n of candidates[i])walk(i+1,[...a,n])}walk(0,[]);best.sort((a,b)=>a-b);lastVoicing=best;return best}function epNote(m,t,vel=.8,dur=.48){let lv=Number(keysLevel.value)/100;let v=.042*vel*lv;synth(m,t,dur,'sine',v,keysBus,5200,.003);synth(m+12,t,dur*.55,'sine',v*.16,keysBus,6200,.002);synth(m,t,dur*.38,'triangle',v*.22,keysBus,3300,.002);setTimeout(()=>{},0)}function jazzKeys(t,ch,vel=.85,dur=.45){let vv=closest(ch.v);vv.forEach((m,i)=>{let human=(i*0.006)+(Math.random()*0.005),dyn=vel*(.82+Math.random()*.22);epNote(m,t+human,dyn,dur*(.9+Math.random()*.16))})}function applyQueued(t){if(queued===null)return;let next=CH[queued];bass(t-.05,next.r-1,false);current=queued;queued=null;jazzKeys(t+.008,CH[current],1,.62);bass(t+.014,CH[current].r,true);history.push(CH[current].n);if(history.length>12)history.shift();draw();state()}function schedule(s,t){let six=60/Number(bpm.value)/4,p=Number(pocket.value)/100,odd=s%2,kT=t+(odd?p*six*.12:0),snT=t+(odd?p*six*.24:0)+.017,bT=t+(odd?p*six*.29:0)+.011,hT=t+(odd?p*six*.32:0)+(Math.random()-.5)*.008;if(s%4===0)applyQueued(t);if([0,7,10].includes(s))kick(kT,s===0?1:.82);if([4,12].includes(s))snare(snT,s===12?.9:1);hat(hT,s%4===0?.9:odd?.4:.6);if(s%2===0)hat(hT+.006,.35);let ch=CH[current],line={0:[0,1],3:[7,0],5:[-1,0],6:[0,0],8:[12,1],10:[7,0],13:[12,0],15:[-1,0]}[s];if(line)bass(bT,ch.r+line[0],!!line[1]);if([2,6,10,15].includes(s))jazzKeys(t+(odd?p*six*.23:0)+.006,ch,s===15?.62:.78,s===15?.32:.15)}function scheduler(){if(!running)return;let six=60/Number(bpm.value)/4;while(nextTime<ac.currentTime+.12){schedule(step,nextTime);let v=step,d=Math.max(0,(nextTime-ac.currentTime)*1000);setTimeout(()=>[...meter.children].forEach((x,i)=>x.classList.toggle('on',i===v)),d);nextTime+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}async function toggle(){await audio();running=!running;groove.dataset.on=running;groove.textContent=running?'■ STOP':'▶ GROOVE';if(running){step=0;nextTime=ac.currentTime+.06;scheduler()}else{clearTimeout(timer);[...meter.children].forEach(x=>x.classList.remove('on'))}state()}async function choose(i){await audio();if(running)queued=i;else{current=i;jazzKeys(ac.currentTime+.005,CH[i],1,.8);bass(ac.currentTime+.012,CH[i].r,true);history.push(CH[i].n);draw()}state()}function render(){pads.replaceChildren(...CH.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<div class="chord-name">'+c.n+'</div><div class="voicing">'+c.vn+'</div><div class="key-label">'+KEYS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();choose(i)};return b}));state()}function state(){[...pads.children].forEach((b,i)=>{b.dataset.active=i===current;b.dataset.queued=i===queued});status.textContent=(running?'GROOVE ON':'GROOVE OFF')+' · NOW '+CH[current].n+(queued!==null?' · NEXT '+CH[queued].n:'')+' · '+bpm.value+' BPM'}function draw(){if(!history.length){prog.textContent='コード履歴';return}prog.replaceChildren(...history.map(x=>{let z=document.createElement('span');z.textContent=x;return z}))}groove.onclick=toggle;[bpm,pocket,keysLevel].forEach(x=>x.oninput=state);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();choose(i)}});render();</script></body></html>
