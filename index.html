<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Jazz Instrument</title><style>*{box-sizing:border-box}:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#090909;color:#171717}body{margin:0;min-height:100vh;background:#090909;background-image:radial-gradient(#242424 1px,transparent 1px);background-size:28px 28px;display:grid;place-items:center;padding:32px}.instrument{width:min(1180px,96vw);background:#f4f4f2;border:1px solid #aaa;border-radius:34px;padding:34px;box-shadow:0 30px 90px #000;color:#171717}.top{display:flex;justify-content:space-between;gap:18px;align-items:end}.brand{font-size:28px;font-weight:900;letter-spacing:-.06em}.tag{font-size:12px;opacity:.5}.controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}button,input{font:inherit}.play,.settings{border:1px solid #aaa;background:#fff;border-radius:12px;padding:10px 14px}.play[data-on=true]{background:#111;color:#fff}.settings-panel{display:none;margin-top:14px;padding:14px;border:1px solid #ccc;border-radius:14px;gap:14px;flex-wrap:wrap}.settings-panel.open{display:flex}.pads{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:28px}.pad{min-height:142px;background:#fafafa;border:1px solid #bbb;border-radius:17px;box-shadow:0 7px 0 #ddd;cursor:pointer;color:#222}.pad[data-active=true]{background:#e9e7ff;border-color:#7971ff;box-shadow:0 7px 0 #c8c4ff}.pad[data-queued=true]{outline:3px solid #b65cff}.chord{font-size:30px;font-weight:900}.voice{font-size:11px;opacity:.45;margin-top:7px}.key{font-size:12px;opacity:.45;margin-top:15px}.status{text-align:center;font-size:12px;opacity:.58;margin:22px 0 12px}.keyboard-wrap{background:#ededeb;border:1px solid #ccc;border-radius:20px;padding:24px;overflow-x:auto}.keyboard{position:relative;display:flex;height:190px;min-width:820px}.white{position:relative;flex:1;background:#fff;border:1px solid #ccc;border-right:0;border-radius:0 0 5px 5px}.white:last-child{border-right:1px solid #ccc}.white.active{background:#c9c6ff}.white.bass{background:#ffd7a8}.black{position:absolute;top:0;width:4.1%;height:58%;background:#292929;border-radius:0 0 5px 5px;z-index:3;transform:translateX(-50%)}.black.active{background:#6c63ff}.black.bass{background:#d98224}.note-label{position:absolute;bottom:8px;width:100%;text-align:center;font-size:10px;opacity:.35}.hint{text-align:center;color:#888;font-size:12px;margin-top:18px}.history{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:12px}.history span{color:#aaa;border:1px solid #333;border-radius:999px;padding:5px 9px}@media(max-width:800px){body{padding:12px}.instrument{padding:20px;border-radius:22px}.pads{grid-template-columns:repeat(4,1fr)}.pad{min-height:105px}.top{align-items:start;flex-direction:column}}</style></head><body><main><section class="instrument"><div class="top"><div><div class="brand">attrip jazz</div><div class="tag">press a chord. you're in the band.</div></div><div class="controls"><button class="play" id="groove">SPACE · BAND</button><button class="settings" id="settings">⚙</button></div></div><div class="settings-panel" id="settingsPanel"><label>BPM <input id="bpm" type="number" min="80" max="125" value="102" style="width:64px"></label><label>BARK <input id="bark" type="range" min="0" max="100" value="58"></label><label>BELL <input id="bell" type="range" min="0" max="100" value="42"></label><label>KEYS <input id="keysLevel" type="range" min="60" max="160" value="120"></label></div><div class="pads" id="pads"></div><div class="status" id="status"></div><div class="keyboard-wrap"><div class="keyboard" id="keyboard"></div></div><div class="hint">紫 = Keysが実際に鳴らしている音　橙 = Bassのルート　A S D F G H J = chords　Space = band</div></section><div class="history" id="history"></div></main><script>const CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],KEYS=['A','S','D','F','G','H','J'];const CH=[{n:'Dm9',r:38,v:[53,57,60,64],vn:'F A C E'},{n:'G13',r:43,v:[53,59,64,69],vn:'F B E A'},{n:'Cmaj9',r:36,v:[52,59,62,67],vn:'E B D G'},{n:'A7♯9',r:45,v:[55,61,63,67],vn:'G C# C G'},{n:'Em9',r:40,v:[55,59,62,66],vn:'G B D F#'},{n:'A13',r:45,v:[55,61,66,71],vn:'G C# F# B'},{n:'Fmaj9',r:41,v:[52,57,60,67],vn:'E A C G'}];let ac,master,keysBus,bassBus,running=false,timer,step=0,nextTime=0,current=0,queued=null,hist=[],lastVoicing=CH[0].v,activeKeys=CH[0].v;const $=s=>document.querySelector(s),groove=$('#groove'),bpm=$('#bpm'),bark=$('#bark'),bell=$('#bell'),keysLevel=$('#keysLevel'),pads=$('#pads'),status=$('#status'),history=$('#history'),keyboard=$('#keyboard');function hz(m){return 440*Math.pow(2,(m-69)/12)}async function audio(){if(!ac){ac=new AudioContext();master=ac.createDynamicsCompressor();master.connect(ac.destination);keysBus=ac.createGain();keysBus.gain.value=1.2;keysBus.connect(master);bassBus=ac.createGain();bassBus.connect(master)}if(ac.state==='suspended')await ac.resume()}function simple(m,t,dur,type,vol,dest=master,cut=8000){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(dest);o.start(t);o.stop(t+dur+.03)}function fm(freq,t,dur,cr,mr,index,vol,rel){let c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();c.frequency.value=freq*cr;m.frequency.value=freq*mr;mg.gain.setValueAtTime(freq*index,t);mg.gain.exponentialRampToValueAtTime(Math.max(.01,freq*index*.07),t+.18);m.connect(mg).connect(c.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur+rel);c.connect(g).connect(keysBus);m.start(t);c.start(t);m.stop(t+dur+rel+.03);c.stop(t+dur+rel+.03)}function ep(m,t,v=.8,d=.55){let lv=+keysLevel.value/100,b=+bark.value/100,be=+bell.value/100,f=hz(m);fm(f,t,d,1,1,1+b*2.8*v,.04*lv*v,.3);fm(f,t,d*.72,1,.5,.7+b*.8,.018*lv*v,.22);fm(f,t,d*.3,1,15,.1+be*.4*v,.009*lv*v,.08)}function closest(raw){let best=null,score=1e9,c=raw.map(n=>[n-12,n,n+12]);function w(i,a){if(i===c.length){let s=a.reduce((z,n)=>z+Math.min(...lastVoicing.map(x=>Math.abs(x-n))),0);if(s<score){score=s;best=[...a]}return}c[i].forEach(n=>w(i+1,[...a,n]))}w(0,[]);best.sort((a,b)=>a-b);lastVoicing=best;return best}function keys(t,ch,v=.85,d=.5){activeKeys=closest(ch.v);paintKeyboard();activeKeys.forEach((m,i)=>ep(m,t+i*.006+Math.random()*.004,v*(.85+Math.random()*.16),d))}function bass(t,m,a=false){simple(m,t,a?.2:.13,'square',a?.12:.075,bassBus,600);simple(m,t,a?.18:.12,'sine',a?.09:.06,bassBus,420)}function noise(t,dur,vol,hp){let b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t)}function kick(t){simple(36,t,.18,'sine',.24,master,400)}function apply(t){if(queued===null)return;current=queued;queued=null;let ch=CH[current];keys(t+.008,ch,1,.62);bass(t+.014,ch.r,true);hist.push(ch.n);if(hist.length>10)hist.shift();drawHistory();state()}function schedule(s,t){let six=60/+bpm.value/4,sw=s%2?six*.16:0;if(s%4===0)apply(t);if([0,7,10].includes(s))kick(t+sw*.4);if([4,12].includes(s))noise(t+sw+.015,.1,.1,900);noise(t+sw*.9,.025,s%4===0?.022:.012,6000);let ch=CH[current],line={0:[0,1],3:[7,0],6:[0,0],8:[12,1],10:[7,0],13:[12,0],15:[-1,0]}[s];if(line)bass(t+sw+.01,ch.r+line[0],!!line[1]);if([2,6,10,15].includes(s))keys(t+sw+.006,ch,.68,.13)}function scheduler(){if(!running)return;let six=60/+bpm.value/4;while(nextTime<ac.currentTime+.12){schedule(step,nextTime);nextTime+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}async function toggle(){await audio();running=!running;groove.dataset.on=running;groove.textContent=running?'SPACE · STOP':'SPACE · BAND';if(running){step=0;nextTime=ac.currentTime+.05;scheduler()}else clearTimeout(timer);state()}async function choose(i){await audio();if(running)queued=i;else{current=i;keys(ac.currentTime+.005,CH[i],1,.8);bass(ac.currentTime+.012,CH[i].r,true);hist.push(CH[i].n);drawHistory()}state()}function renderPads(){pads.replaceChildren(...CH.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<div class="chord">'+c.n+'</div><div class="voice">'+c.vn+'</div><div class="key">'+KEYS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();choose(i)};return b}))}const whites=[48,50,52,53,55,57,59,60,62,64,65,67,69,71,72,74,76,77,79,81,83];const blacks=[49,51,54,56,58,61,63,66,68,70,73,75,78,80,82];function noteName(m){return ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m%12]}function renderKeyboard(){keyboard.innerHTML='';whites.forEach(m=>{let k=document.createElement('div');k.className='white';k.dataset.m=m;k.innerHTML='<span class="note-label">'+noteName(m)+'</span>';keyboard.appendChild(k)});blacks.forEach(m=>{let idx=whites.filter(w=>w<m).length;let k=document.createElement('div');k.className='black';k.dataset.m=m;k.style.left=(idx/whites.length*100)+'%';keyboard.appendChild(k)});paintKeyboard()}function paintKeyboard(){keyboard.querySelectorAll('[data-m]').forEach(k=>{let m=+k.dataset.m,pc=m%12;let keyOn=activeKeys.some(n=>n%12===pc),bassOn=CH[current].r%12===pc;k.classList.toggle('active',keyOn);k.classList.toggle('bass',bassOn&&!keyOn)})}function state(){[...pads.children].forEach((b,i)=>{b.dataset.active=i===current;b.dataset.queued=i===queued});status.textContent=(running?'BAND ON':'BAND OFF')+' · NOW '+CH[current].n+(queued!==null?' · NEXT '+CH[queued].n:'')}function drawHistory(){history.replaceChildren(...hist.map(x=>{let s=document.createElement('span');s.textContent=x;return s}))}groove.onclick=toggle;$('#settings').onclick=()=>$('#settingsPanel').classList.toggle('open');[bpm,bark,bell,keysLevel].forEach(x=>x.oninput=state);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();choose(i)}});renderPads();renderKeyboard();state();</script></body></html>
