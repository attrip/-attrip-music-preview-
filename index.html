<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Jazz Instrument</title><style>*{box-sizing:border-box}:root{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#090909;color:#171717}body{margin:0;min-height:100vh;background:#090909;background-image:radial-gradient(#242424 1px,transparent 1px);background-size:28px 28px;display:grid;place-items:center;padding:28px}.instrument{width:min(1280px,97vw);background:#f4f4f2;border:1px solid #aaa;border-radius:34px;padding:34px;box-shadow:0 30px 90px #000;color:#171717}.top{display:flex;justify-content:space-between;gap:18px;align-items:end}.brand{font-size:28px;font-weight:900;letter-spacing:-.06em}.tag{font-size:12px;opacity:.5}.controls{display:flex;gap:10px}.play,.settings{border:1px solid #aaa;background:#fff;border-radius:12px;padding:10px 14px;font:inherit}.play[data-on=true]{background:#111;color:#fff}.settings-panel{display:none;margin-top:14px;padding:14px;border:1px solid #ccc;border-radius:14px;gap:14px;flex-wrap:wrap}.settings-panel.open{display:flex}.pads{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin-top:28px}.pad{min-height:142px;background:#fafafa;border:1px solid #bbb;border-radius:17px;box-shadow:0 7px 0 #ddd;cursor:pointer;color:#222;touch-action:none;font:inherit}.pad[data-active=true]{background:#e9e7ff;border-color:#7971ff;box-shadow:0 3px 0 #c8c4ff;transform:translateY(4px)}.pad[data-queued=true]{outline:3px solid #b65cff}.chord{font-size:28px;font-weight:900}.voice{font-size:11px;opacity:.48;margin-top:7px}.key{font-size:12px;opacity:.45;margin-top:14px}.status{text-align:center;font-size:12px;opacity:.62;margin:22px 0 12px}.keyboard-wrap{background:#ededeb;border:1px solid #ccc;border-radius:20px;padding:20px;overflow-x:auto}.keyboard{position:relative;display:flex;height:190px;min-width:1320px}.white{position:relative;flex:1;background:#fff;border:1px solid #ccc;border-right:0;border-radius:0 0 5px 5px;transition:background .08s}.white:last-child{border-right:1px solid #ccc}.white.active{background:#c9c6ff}.white.bass{background:#ffd7a8}.black{position:absolute;top:0;width:2.75%;height:58%;background:#292929;border-radius:0 0 5px 5px;z-index:3;transform:translateX(-50%);transition:background .08s}.black.active{background:#6c63ff}.black.bass{background:#d98224}.note-label{position:absolute;bottom:8px;width:100%;text-align:center;font-size:10px;opacity:.34}.hint{text-align:center;color:#777;font-size:12px;margin-top:18px;line-height:1.7}.history{display:flex;justify-content:center;gap:7px;flex-wrap:wrap;margin-top:12px}.history span{color:#aaa;border:1px solid #333;border-radius:999px;padding:5px 9px}@media(max-width:800px){body{padding:10px}.instrument{padding:20px;border-radius:22px}.pads{grid-template-columns:repeat(4,1fr)}.pad{min-height:105px}.top{align-items:start;flex-direction:column}}</style></head><body><main><section class="instrument"><div class="top"><div><div class="brand">attrip jazz</div><div class="tag">REAL PIANO · wide voicing · C2–C6</div></div><div class="controls"><button class="play" id="groove">SPACE · BAND</button><button class="settings" id="settings">⚙</button></div></div><div class="settings-panel" id="settingsPanel"><label>BPM <input id="bpm" type="number" min="80" max="125" value="102" style="width:64px"></label><label>PIANO <input id="keysLevel" type="range" min="60" max="160" value="115"></label></div><div class="pads" id="pads"></div><div class="status" id="status"></div><div class="keyboard-wrap"><div class="keyboard" id="keyboard"></div></div><div class="hint">紫 = Pianoの実音　橙 = Bassの実音。表示範囲 C2〜C6。<br>音源は SOUND DECISION の 3 · REAL PIANO。A S D F G H J は押している間鳴り、SpaceでBand。</div></section><div class="history" id="history"></div></main><script>const CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],KEYS=['A','S','D','F','G','H','J'];const CH=[{n:'Dm9',r:38,v:[53,60,64,69],vn:'F3 C4 E4 A4'},{n:'G13',r:43,v:[53,59,64,69],vn:'F3 B3 E4 A4'},{n:'Cmaj9',r:36,v:[52,59,62,67],vn:'E3 B3 D4 G4'},{n:'A7♯9',r:45,v:[55,61,64,72],vn:'G3 C#4 E4 C5'},{n:'Em9',r:40,v:[55,59,62,66],vn:'G3 B3 D4 F#4'},{n:'A13',r:45,v:[55,61,66,71],vn:'G3 C#4 F#4 B4'},{n:'Fmaj9',r:41,v:[52,57,60,67],vn:'E3 A3 C4 G4'}];const SAMPLE_ROOT='https://unpkg.com/@audio-samples/piano-velocity8@1.0.5/audio/';const SAMPLE_MIDI=[36,39,42,45,48,51,54,57,60,63,66,69,72,75,78,81,84];let ac,master,keysBus,bassBus,running=false,timer,step=0,nextTime=0,current=0,queued=null,hist=[],activeKeys=[],activeBass=null,heldIndex=null,heldVoices=[],sampleCache=new Map(),loading=false;const $=s=>document.querySelector(s),groove=$('#groove'),bpm=$('#bpm'),keysLevel=$('#keysLevel'),pads=$('#pads'),status=$('#status'),history=$('#history'),keyboard=$('#keyboard');function sampleFile(m){const names={0:'C',3:'D%23',6:'F%23',9:'A'};return names[m%12]+(Math.floor(m/12)-1)+'v8.ogg'}function nearestSample(m){return SAMPLE_MIDI.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a)}async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-18;master.ratio.value=3;master.attack.value=.01;master.release.value=.35;master.connect(ac.destination);keysBus=ac.createGain();keysBus.gain.value=1.0;keysBus.connect(master);bassBus=ac.createGain();bassBus.gain.value=.82;bassBus.connect(master)}if(ac.state==='suspended')await ac.resume()}async function loadSample(sm){if(sampleCache.has(sm))return sampleCache.get(sm);let r=await fetch(SAMPLE_ROOT+sampleFile(sm));if(!r.ok)throw new Error('HTTP '+r.status+' '+sampleFile(sm));let buf=await ac.decodeAudioData(await r.arrayBuffer());sampleCache.set(sm,buf);return buf}async function warmSamples(){if(loading)return;loading=true;status.textContent='REAL PIANO · LOADING…';try{let needed=[...new Set(CH.flatMap(c=>[...c.v,c.r].map(nearestSample)))];await Promise.all(needed.map(loadSample));status.textContent='REAL PIANO · READY'}catch(e){status.textContent='REAL PIANO · LOAD FAILED: '+e.message}finally{loading=false}}async function heldPiano(m,t,vol=1){let sm=nearestSample(m),buf=await loadSample(sm),src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;src.playbackRate.value=Math.pow(2,(m-sm)/12);let lv=+keysLevel.value/100;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.11*lv*vol,t+.006);src.connect(g).connect(keysBus);src.start(t);return{nodes:[src],gain:g}}async function heldBass(m,t){let sm=nearestSample(m),buf=await loadSample(sm),src=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();src.buffer=buf;src.playbackRate.value=Math.pow(2,(m-sm)/12);f.type='lowpass';f.frequency.value=700;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.085,t+.008);src.connect(f).connect(g).connect(bassBus);src.start(t);return{nodes:[src],gain:g}}function releaseHeld(){if(!ac||!heldVoices.length)return;let t=ac.currentTime;heldVoices.forEach(v=>{try{v.gain.gain.cancelScheduledValues(t);let now=Math.max(.0001,v.gain.gain.value||.02);v.gain.gain.setValueAtTime(now,t);v.gain.gain.exponentialRampToValueAtTime(.0001,t+.85);v.nodes.forEach(n=>n.stop(t+.92))}catch{}});heldVoices=[];heldIndex=null;activeKeys=[];activeBass=null;paintKeyboard();state()}async function oneShotPiano(m,t,d=.5,vol=.6){let sm=nearestSample(m),buf=await loadSample(sm),src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;src.playbackRate.value=Math.pow(2,(m-sm)/12);let lv=+keysLevel.value/100;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075*lv*vol,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(g).connect(keysBus);src.start(t);src.stop(t+d+.05)}function schedule(s,t){if(s%4===0&&queued!==null){current=queued;queued=null;hist.push(CH[current].n);if(hist.length>10)hist.shift();drawHistory();state()}let ch=CH[current];if([0,4,8,12].includes(s))ch.v.forEach(m=>oneShotPiano(m,t,.42,.48).catch(()=>{}));if([0,8].includes(s))oneShotPiano(ch.r,t,.28,.65).catch(()=>{})}function scheduler(){if(!running)return;let six=60/+bpm.value/4;while(nextTime<ac.currentTime+.12){schedule(step,nextTime);nextTime+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}async function toggle(){await audio();releaseHeld();if(sampleCache.size===0)await warmSamples();running=!running;groove.dataset.on=running;groove.textContent=running?'SPACE · STOP':'SPACE · BAND';if(running){step=0;nextTime=ac.currentTime+.05;scheduler()}else clearTimeout(timer);state()}async function pressChord(i){await audio();if(sampleCache.size===0)await warmSamples();if(running){queued=i;state();return}releaseHeld();current=i;heldIndex=i;let ch=CH[i],t=ac.currentTime+.012;activeKeys=[...ch.v];activeBass=ch.r;paintKeyboard();try{let voices=await Promise.all([...ch.v.map(m=>heldPiano(m,t,1)),heldBass(ch.r,t)]);heldVoices.push(...voices);hist.push(ch.n);if(hist.length>10)hist.shift();drawHistory();status.textContent='REAL PIANO · '+ch.n;state()}catch(e){status.textContent='REAL PIANO · LOAD FAILED: '+e.message}}function releaseChord(i){if(!running&&heldIndex===i)releaseHeld()}function renderPads(){pads.replaceChildren(...CH.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<div class="chord">'+c.n+'</div><div class="voice">'+c.vn+'</div><div class="key">'+KEYS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture?.(e.pointerId);pressChord(i)};b.onpointerup=e=>{e.preventDefault();releaseChord(i)};b.onpointercancel=()=>releaseChord(i);return b}))}const whites=[];for(let m=36;m<=84;m++)if(![1,3,6,8,10].includes(m%12))whites.push(m);const blacks=[];for(let m=36;m<=83;m++)if([1,3,6,8,10].includes(m%12))blacks.push(m);function noteName(m){return ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'][m%12]+(Math.floor(m/12)-1)}function renderKeyboard(){keyboard.innerHTML='';whites.forEach(m=>{let k=document.createElement('div');k.className='white';k.dataset.m=m;k.innerHTML='<span class="note-label">'+noteName(m)+'</span>';keyboard.appendChild(k)});blacks.forEach(m=>{let idx=whites.filter(w=>w<m).length;let k=document.createElement('div');k.className='black';k.dataset.m=m;k.style.left=(idx/whites.length*100)+'%';keyboard.appendChild(k)});paintKeyboard()}function paintKeyboard(){keyboard.querySelectorAll('[data-m]').forEach(k=>{let m=+k.dataset.m;k.classList.toggle('active',activeKeys.includes(m));k.classList.toggle('bass',activeBass===m&&!activeKeys.includes(m))})}function state(){[...pads.children].forEach((b,i)=>{b.dataset.active=i===current&&(running||heldIndex===i);b.dataset.queued=i===queued});if(!status.textContent.includes('LOAD'))status.textContent=(running?'BAND ON · REAL PIANO':'MANUAL · REAL PIANO')+' · NOW '+CH[current].n+(queued!==null?' · NEXT '+CH[queued].n:'')+(heldIndex!==null?' · HOLDING '+KEYS[heldIndex]:'')}function drawHistory(){history.replaceChildren(...hist.map(x=>{let s=document.createElement('span');s.textContent=x;return s}))}groove.onclick=toggle;$('#settings').onclick=()=>$('#settingsPanel').classList.toggle('open');document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();pressChord(i)}});document.addEventListener('keyup',e=>{let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();releaseChord(i)}});window.addEventListener('blur',releaseHeld);renderPads();renderKeyboard();state();</script></body></html>
