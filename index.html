<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP FM Rhodes Lab</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:1000px;margin:auto;display:grid;gap:18px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;opacity:.6}h1{margin:0;font-size:clamp(36px,6vw,68px)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:12px;padding:10px}.play{font-weight:850}.play[data-on=true]{background:currentColor;color:Canvas}.hint,.status{font-size:13px;opacity:.72}.pads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.pad{min-height:145px;border:1px solid currentColor;border-radius:18px;background:transparent;color:inherit;cursor:pointer}.pad[data-active=true]{background:color-mix(in srgb,currentColor 14%,transparent)}.pad[data-queued=true]{outline:3px solid currentColor;outline-offset:-5px}.chord-name{font-size:clamp(22px,3vw,36px);font-weight:850}.voicing{font-size:11px;opacity:.55;margin-top:8px}.key-label{font-size:12px;opacity:.48;margin-top:16px}.meter{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.step{height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent)}.step.on{background:currentColor}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:42px}.progression span{padding:7px 11px;border:1px solid currentColor;border-radius:999px}@media(max-width:760px){.pads{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){body{padding:14px}.pads{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><div><div class="eyebrow">ATTRIP / FM RHODES ENGINE v0.6</div><h1>サンプルなしで、鍵盤を作る。</h1><p>4-operator inspired FM electric piano experiment</p></div><div class="controls"><button class="play" id="groove">▶ GROOVE</button><label>BPM <input id="bpm" type="number" min="80" max="125" value="102" style="width:62px"></label><label>BARK <input id="bark" type="range" min="0" max="100" value="58"></label><label>BELL <input id="bell" type="range" min="0" max="100" value="42"></label><label>KEYS <input id="keysLevel" type="range" min="60" max="160" value="120"></label></div><div class="hint">A S D F G H J。Bassはルート、Keysはrootless voicing。BARKを上げると強く叩いたElectric Pianoの荒さ、BELLでtineの金属感を調整します。</div><div class="pads" id="pads"></div><div class="status" id="status"></div><div class="meter" id="meter"></div><div class="progression" id="progression">コード履歴</div></main><script>const CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],KEYS=['A','S','D','F','G','H','J'];const CH=[{n:'Dm9',r:38,v:[53,57,60,64],vn:'F A C E'},{n:'G13',r:43,v:[53,59,64,69],vn:'F B E A'},{n:'Cmaj9',r:36,v:[52,59,62,67],vn:'E B D G'},{n:'A7♯9',r:45,v:[55,61,63,67],vn:'G C# C G'},{n:'Em9',r:40,v:[55,59,62,66],vn:'G B D F#'},{n:'A13',r:45,v:[55,61,66,71],vn:'G C# F# B'},{n:'Fmaj9',r:41,v:[52,57,60,67],vn:'E A C G'}];let ac,master,keysBus,bassBus,running=false,timer,step=0,nextTime=0,current=0,queued=null,history=[],lastVoicing=CH[0].v;const $=s=>document.querySelector(s),groove=$('#groove'),bpm=$('#bpm'),bark=$('#bark'),bell=$('#bell'),keysLevel=$('#keysLevel'),pads=$('#pads'),status=$('#status'),meter=$('#meter'),prog=$('#progression');for(let i=0;i<16;i++){let x=document.createElement('span');x.className='step';meter.appendChild(x)}function hz(m){return 440*Math.pow(2,(m-69)/12)}async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-17;master.knee.value=14;master.ratio.value=3;master.attack.value=.01;master.release.value=.28;master.connect(ac.destination);keysBus=ac.createGain();keysBus.gain.value=1.2;keysBus.connect(master);bassBus=ac.createGain();bassBus.gain.value=.95;bassBus.connect(master)}if(ac.state==='suspended')await ac.resume()}function simple(m,t,dur,type,vol,dest=master,cut=8000){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(dest);o.start(t);o.stop(t+dur+.03)}function fmPair(freq,t,dur,carrierRatio,modRatio,index,vol,attack,release){let c=ac.createOscillator(),m=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain(),f=ac.createBiquadFilter();c.type='sine';m.type='sine';c.frequency.value=freq*carrierRatio;m.frequency.value=freq*modRatio;mg.gain.setValueAtTime(freq*index,t);mg.gain.exponentialRampToValueAtTime(Math.max(.01,freq*index*.08),t+Math.min(.22,dur*.45));m.connect(mg).connect(c.frequency);f.type='lowpass';f.frequency.value=5200;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+attack);g.gain.exponentialRampToValueAtTime(Math.max(.0002,vol*.32),t+Math.min(.22,dur*.35));g.gain.exponentialRampToValueAtTime(.0001,t+dur+release);c.connect(f).connect(g).connect(keysBus);m.start(t);c.start(t);m.stop(t+dur+release+.04);c.stop(t+dur+release+.04)}function rhodesNote(m,t,vel=.8,dur=.58){let lv=Number(keysLevel.value)/100,b=Number(bark.value)/100,be=Number(bell.value)/100,f=hz(m),hard=Math.min(1.25,vel);fmPair(f,t,dur,1,1,1.1+b*2.8*hard,.042*lv*vel,.004,.34);fmPair(f,t,dur*.72,1,.5,.65+b*.9,.019*lv*vel,.003,.24);fmPair(f,t,dur*.34,1,15,.10+be*.42*hard,.010*lv*vel,.001,.09);simple(m+12,t,dur*.28,'sine',.006*lv*be*vel,keysBus,6500)}function closest(raw){let best=null,score=1e9,cands=raw.map(n=>[n-12,n,n+12]);function walk(i,a){if(i===cands.length){let s=a.reduce((z,n)=>z+Math.min(...lastVoicing.map(x=>Math.abs(x-n))),0);if(Math.max(...a)-Math.min(...a)>18)s+=8;if(s<score){score=s;best=[...a]}return}cands[i].forEach(n=>walk(i+1,[...a,n]))}walk(0,[]);best.sort((a,b)=>a-b);lastVoicing=best;return best}function keys(t,ch,vel=.85,dur=.52){closest(ch.v).forEach((m,i)=>rhodesNote(m,t+i*.006+Math.random()*.004,vel*(.84+Math.random()*.18),dur*(.92+Math.random()*.12)))}function bass(t,m,a=false){simple(m,t,a?.22:.14,'square',a?.14:.09,bassBus,600);simple(m,t,a?.2:.13,'sine',a?.11:.07,bassBus,420)}function noise(t,dur,vol,hp){let b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur)}function kick(t){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(116,t);o.frequency.exponentialRampToValueAtTime(43,t+.12);g.gain.setValueAtTime(.28,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(master);o.start(t);o.stop(t+.22)}function apply(t){if(queued===null)return;let n=CH[queued];bass(t-.045,n.r-1,false);current=queued;queued=null;keys(t+.008,n,1,.66);bass(t+.014,n.r,true);history.push(n.n);if(history.length>12)history.shift();draw();state()}function schedule(s,t){let six=60/Number(bpm.value)/4,odd=s%2,sw=odd?six*.16:0;if(s%4===0)apply(t);if([0,7,10].includes(s))kick(t+sw*.45);if([4,12].includes(s))noise(t+sw+.016,.11,.12,950);noise(t+sw*.9,.03,s%4===0?.026:.014,5900);let ch=CH[current],line={0:[0,1],3:[7,0],6:[0,0],8:[12,1],10:[7,0],13:[12,0],15:[-1,0]}[s];if(line)bass(t+sw+.01,ch.r+line[0],!!line[1]);if([2,6,10,15].includes(s))keys(t+sw+.006,ch,s===15?.58:.72,s===15?.30:.13)}function scheduler(){if(!running)return;let six=60/Number(bpm.value)/4;while(nextTime<ac.currentTime+.12){schedule(step,nextTime);let v=step,d=Math.max(0,(nextTime-ac.currentTime)*1000);setTimeout(()=>[...meter.children].forEach((x,i)=>x.classList.toggle('on',i===v)),d);nextTime+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}async function toggle(){await audio();running=!running;groove.dataset.on=running;groove.textContent=running?'■ STOP':'▶ GROOVE';if(running){step=0;nextTime=ac.currentTime+.06;scheduler()}else{clearTimeout(timer);[...meter.children].forEach(x=>x.classList.remove('on'))}state()}async function choose(i){await audio();if(running)queued=i;else{current=i;keys(ac.currentTime+.005,CH[i],1,.85);bass(ac.currentTime+.012,CH[i].r,true);history.push(CH[i].n);draw()}state()}function render(){pads.replaceChildren(...CH.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<div class="chord-name">'+c.n+'</div><div class="voicing">'+c.vn+'</div><div class="key-label">'+KEYS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();choose(i)};return b}));state()}function state(){[...pads.children].forEach((b,i)=>{b.dataset.active=i===current;b.dataset.queued=i===queued});status.textContent=(running?'GROOVE ON':'GROOVE OFF')+' · NOW '+CH[current].n+(queued!==null?' · NEXT '+CH[queued].n:'')+' · BARK '+bark.value+' · BELL '+bell.value}function draw(){if(!history.length){prog.textContent='コード履歴';return}prog.replaceChildren(...history.map(x=>{let z=document.createElement('span');z.textContent=x;return z}))}groove.onclick=toggle;[bpm,bark,bell,keysLevel].forEach(x=>x.oninput=state);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();choose(i)}});render();</script></body></html>
