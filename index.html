<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Funk Changes</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:1000px;margin:auto;display:grid;gap:18px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;opacity:.6}h1{margin:0;font-size:clamp(36px,6vw,68px)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:12px;padding:10px}.play{font-weight:850}.play[data-on=true]{background:currentColor;color:Canvas}.hint,.status{font-size:13px;opacity:.72}.pads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.pad{min-height:140px;border:1px solid currentColor;border-radius:18px;background:transparent;color:inherit;cursor:pointer}.pad[data-active=true]{background:color-mix(in srgb,currentColor 14%,transparent)}.pad[data-queued=true]{outline:3px solid currentColor;outline-offset:-5px}.chord-name{font-size:clamp(22px,3vw,36px);font-weight:850}.degree,.key-label{font-size:12px;opacity:.48}.key-label{margin-top:18px}.meter{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.step{height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent)}.step.on{background:currentColor}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:42px}.progression span{padding:7px 11px;border:1px solid currentColor;border-radius:999px}@media(max-width:760px){.pads{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){body{padding:14px}.pads{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app"><div><div class="eyebrow">ATTRIP / FUNK CHANGES v0.4</div><h1>押す。次の拍で、つながる。</h1><p id="meta">Acid jazz / funk inspired harmony — original groove design</p></div><div class="controls"><button class="play" id="groove">▶ GROOVE</button><label>BPM <input id="bpm" type="number" min="80" max="125" value="104" style="width:62px"></label><label>POCKET <input id="pocket" type="range" min="0" max="100" value="72"></label><label>BASS <input id="bassLevel" type="range" min="50" max="150" value="115"></label></div><div class="hint">A S D F G H Jでコードを予約します。演奏中は突然切り替わらず、次の4分音符で着地。コードは9th/13th中心、ボイシングは近い音へ滑らかに移動します。</div><div class="pads" id="pads"></div><div class="status" id="status"></div><div class="meter" id="meter"></div><div class="progression" id="progression">コードを予約すると履歴が残ります。</div></main><script>const CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],KEYS=['A','S','D','F','G','H','J'];const CH=[{n:'Dm9',r:38,v:[53,57,60,64]},{n:'G13',r:43,v:[53,57,59,64]},{n:'Cmaj9',r:36,v:[52,55,59,62]},{n:'A7♯9',r:45,v:[52,55,61,63]},{n:'Em9',r:40,v:[55,59,62,66]},{n:'A13',r:45,v:[55,59,61,66]},{n:'Fmaj9',r:41,v:[52,57,60,64]}];let ac,master,bassBus,running=false,timer,step=0,nextTime=0,current=0,queued=null,history=[],lastVoicing=CH[0].v;const $=s=>document.querySelector(s),groove=$('#groove'),bpm=$('#bpm'),pocket=$('#pocket'),bassLevel=$('#bassLevel'),pads=$('#pads'),status=$('#status'),meter=$('#meter'),prog=$('#progression');for(let i=0;i<16;i++){let x=document.createElement('span');x.className='step';meter.appendChild(x)}function midi(m){return 440*Math.pow(2,(m-69)/12)}async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-17;master.ratio.value=3.5;master.attack.value=.009;master.release.value=.25;master.connect(ac.destination);bassBus=ac.createGain();bassBus.gain.value=1.15;bassBus.connect(master)}if(ac.state==='suspended')await ac.resume()}function tone(m,t,dur,type,vol,dest=master,cut=8000){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=midi(m);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(dest);o.start(t);o.stop(t+dur+.02)}function noise(t,dur,vol,hp){let b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur)}function kick(t,v=1){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(120,t);o.frequency.exponentialRampToValueAtTime(43,t+.12);g.gain.setValueAtTime(.34*v,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(master);o.start(t);o.stop(t+.22)}function snare(t,v=1){noise(t,.11,.145*v,900);tone(50,t,.07,'triangle',.05*v)}function hat(t,v=.6){noise(t,.035,.035*v,5700)}function bass(t,m,kind='main'){let lv=Number(bassLevel.value)/100,vol={main:.13,accent:.18,ghost:.045}[kind]*lv,dur={main:.15,accent:.22,ghost:.055}[kind];tone(m,t,dur,'square',vol,bassBus,620);tone(m,t,dur*.9,'sine',vol*.8,bassBus,430)}function nearestVoice(raw){let out=[];for(let n of raw){let choices=[n-12,n,n+12],best=choices[0],score=1e9;for(let c of choices){let s=Math.min(...lastVoicing.map(x=>Math.abs(x-c)));if(s<score){score=s;best=c}}out.push(best)}out.sort((a,b)=>a-b);lastVoicing=out;return out}function rhodes(t,ch,v=.8){nearestVoice(ch.v).forEach(m=>{tone(m,t,.12,'sine',.03*v);tone(m+12,t,.07,'sine',.005*v)})}function applyQueued(t){if(queued===null)return;let old=CH[current],next=CH[queued];let approach=next.r-1;bass(t-.045,approach,'ghost');current=queued;queued=null;rhodes(t+.006,CH[current],1);bass(t+.012,CH[current].r,'accent');history.push(CH[current].n);if(history.length>12)history.shift();draw();renderState()}function schedule(s,t){let six=60/Number(bpm.value)/4,p=Number(pocket.value)/100,odd=s%2;let swing=odd?p*six*.26:0,kT=t+(odd?p*six*.13:0),snT=t+swing+.017,bT=t+(odd?p*six*.29:0)+.010,hT=t+(odd?p*six*.32:0)+(Math.random()-.5)*.008;if(s%4===0)applyQueued(t);if([0,7,10].includes(s))kick(kT,s===0?1:.84);if([4,12].includes(s))snare(snT,s===12?.92:1);hat(hT,s%4===0?.9:odd?.42:.62);if(s%2===0)hat(hT+.006,.38);let ch=CH[current],line={0:[0,'accent'],3:[7,'main'],5:[-1,'ghost'],6:[0,'main'],8:[12,'accent'],10:[7,'main'],11:[10,'ghost'],13:[12,'main'],15:[-1,'ghost']}[s];if(line)bass(bT,ch.r+line[0],line[1]);if([2,6,10,15].includes(s))rhodes(t+(odd?p*six*.24:0)+.006,ch,s===15?.7:.82)}function scheduler(){if(!running)return;let six=60/Number(bpm.value)/4;while(nextTime<ac.currentTime+.12){schedule(step,nextTime);let v=step,d=Math.max(0,(nextTime-ac.currentTime)*1000);setTimeout(()=>[...meter.children].forEach((x,i)=>x.classList.toggle('on',i===v)),d);nextTime+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}async function toggle(){await audio();running=!running;groove.dataset.on=running;groove.textContent=running?'■ STOP':'▶ GROOVE';if(running){step=0;nextTime=ac.currentTime+.06;scheduler()}else{clearTimeout(timer);[...meter.children].forEach(x=>x.classList.remove('on'))}renderState()}async function choose(i){await audio();if(running){queued=i}else{current=i;rhodes(ac.currentTime+.005,CH[i],1);bass(ac.currentTime+.01,CH[i].r,'accent');history.push(CH[i].n);draw()}renderState()}function renderPads(){pads.replaceChildren(...CH.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<div class="degree">'+(i+1)+'</div><div class="chord-name">'+c.n+'</div><div class="key-label">'+KEYS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();choose(i)};return b}));renderState()}function renderState(){[...pads.children].forEach((b,i)=>{b.dataset.active=i===current;b.dataset.queued=i===queued});status.textContent=(running?'GROOVE ON':'GROOVE OFF')+' · NOW '+CH[current].n+(queued!==null?' · NEXT '+CH[queued].n:'')+' · '+bpm.value+' BPM'}function draw(){if(!history.length){prog.textContent='コードを予約すると履歴が残ります。';return}prog.replaceChildren(...history.map(x=>{let z=document.createElement('span');z.textContent=x;return z}))}groove.onclick=toggle;[bpm,pocket,bassLevel].forEach(x=>x.oninput=renderState);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();choose(i)}});renderPads();</script></body></html>
