<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Funk Lab</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:1000px;margin:auto;display:grid;gap:18px}.eyebrow{font-size:12px;font-weight:850;letter-spacing:.12em;opacity:.6}h1{margin:0;font-size:clamp(36px,6vw,68px)}.controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center}select,input,button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:12px;padding:10px}.play{font-weight:850}.play[data-on=true]{background:currentColor;color:Canvas}.hint,.status{font-size:13px;opacity:.72}.pads{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.pad{min-height:140px;border:1px solid currentColor;border-radius:18px;background:transparent;color:inherit;cursor:pointer}.pad[data-active=true]{transform:translateY(4px) scale(.98);background:color-mix(in srgb,currentColor 14%,transparent)}.chord-name{font-size:clamp(24px,3vw,38px);font-weight:850}.degree,.key-label{font-size:12px;opacity:.48}.key-label{margin-top:18px}.shift-on .base{display:none}.seventh{display:none}.shift-on .seventh{display:block}.meter{display:grid;grid-template-columns:repeat(16,1fr);gap:4px}.step{height:8px;border-radius:99px;background:color-mix(in srgb,currentColor 12%,transparent)}.step.on{background:currentColor}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:42px}.progression span{padding:7px 11px;border:1px solid currentColor;border-radius:999px}@media(max-width:760px){.pads{grid-template-columns:repeat(4,1fr)}}@media(max-width:480px){body{padding:14px}.pads{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="app" id="app"><div><div class="eyebrow">ATTRIP / FUNK LAB v0.2</div><h1>ポケットに、入る。</h1><p id="meta"></p></div><div class="controls"><button class="play" id="groove">▶ GROOVE</button><select id="key"></select><select id="scale"><option value="minor">Natural Minor</option><option value="major">Major</option></select><label>BPM <input id="bpm" type="number" min="80" max="130" value="104" style="width:62px"></label><label>BOUNCE <input id="swing" type="range" min="0" max="100" value="82"></label><label>BASS <input id="bassLevel" type="range" min="50" max="160" value="125"></label></div><div class="hint">GROOVEをON → A S D F G H J。ベースはルートをなぞるだけでなく、ゴーストノート・オクターブ・5度・半音アプローチで跳ねます。</div><div class="pads" id="pads"></div><div class="status" id="status"></div><div class="meter" id="meter"></div><div class="progression" id="progression">コードを弾くと進行が残ります。</div></main><script>const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],S={major:{i:[0,2,4,5,7,9,11],q:['maj','min','min','maj','maj','min','dim'],s:['maj7','min7','min7','maj7','7','min7','m7b5']},minor:{i:[0,2,3,5,7,8,10],q:['min','dim','maj','min','min','maj','maj'],s:['min7','m7b5','maj7','min7','min7','maj7','7']}},T={maj:[0,4,7],min:[0,3,7],dim:[0,3,6],maj7:[0,4,7,11],min7:[0,3,7,10],'7':[0,4,7,10],m7b5:[0,3,6,10]},CODES=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ'],LABELS=['A','S','D','F','G','H','J'],DEG=['I','II','III','IV','V','VI','VII'];let ac,master,bassBus,cur=[],sel=[],shift=false,running=false,timer,step=0,nextTime=0,currentChord;const $=s=>document.querySelector(s),app=$('#app'),key=$('#key'),scale=$('#scale'),bpm=$('#bpm'),swing=$('#swing'),bassLevel=$('#bassLevel'),pads=$('#pads'),prog=$('#progression'),meta=$('#meta'),status=$('#status'),groove=$('#groove'),meter=$('#meter');N.forEach(n=>key.add(new Option(n,n)));for(let i=0;i<16;i++){let x=document.createElement('span');x.className='step';meter.appendChild(x)}function lab(r,q){return q==='min'?r+'m':q==='dim'?r+'dim':q==='maj7'?r+'maj7':q==='min7'?r+'m7':q==='m7b5'?r+'m7♭5':q==='7'?r+'7':r}function build(){let r=N.indexOf(key.value),s=S[scale.value];cur=s.i.map((v,d)=>{let a=r+v;return{root:N[a%12],tri:s.q[d],sev:s.s[d],base:60+a}});currentChord=cur[0];sel=[];draw();render()}function notes(c,q){return T[q].map(x=>c.base+x)}async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-16;master.knee.value=14;master.ratio.value=4;master.attack.value=.006;master.release.value=.22;master.connect(ac.destination);bassBus=ac.createGain();bassBus.gain.value=1.25;bassBus.connect(master)}if(ac.state==='suspended')await ac.resume()}function tone(freq,t,dur,type,vol,dest=master,cut=9000){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=freq;f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(f).connect(g).connect(dest);o.start(t);o.stop(t+dur+.02)}function noise(t,dur,vol,hp){let b=ac.createBuffer(1,Math.ceil(ac.sampleRate*dur),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+dur);s.connect(f).connect(g).connect(master);s.start(t);s.stop(t+dur)}function kick(t,ghost=false){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(ghost?85:125,t);o.frequency.exponentialRampToValueAtTime(43,t+.12);g.gain.setValueAtTime(ghost?.10:.38,t);g.gain.exponentialRampToValueAtTime(.0001,t+.2);o.connect(g).connect(master);o.start(t);o.stop(t+.22)}function snare(t,ghost=false){noise(t,ghost?.055:.12,ghost?.045:.16,ghost?1400:850);if(!ghost)tone(185,t,.08,'triangle',.065)}function hat(t,open=false,soft=false){noise(t,open?.12:.035,soft?.018:(open?.052:.035),5600)}function bass(t,m,kind='main'){let level=Number(bassLevel.value)/100,f=440*Math.pow(2,(m-69)/12),vol={main:.15,accent:.19,ghost:.055}[kind]*level,dur={main:.18,accent:.27,ghost:.075}[kind];tone(f,t,dur,'square',vol,bassBus,650);tone(f,t,dur*.9,'sine',vol*.75,bassBus,480);if(kind==='accent')tone(f*2,t,.09,'triangle',vol*.22,bassBus,1200)}function rhodes(t,c,dur=.16){notes(c,c.sev).forEach(m=>{let f=440*Math.pow(2,(m-69)/12);tone(f,t,dur,'sine',.032);tone(f*2,t,dur*.6,'sine',.006)})}function schedule(s,t){let bounce=Number(swing.value)/100,six=60/Number(bpm.value)/4;let late=(s%2?bounce*six*.38:0);let tt=t+late;if([0,7,10].includes(s))kick(tt);if([5,14].includes(s))kick(tt,true);if([4,12].includes(s))snare(tt);if([3,11].includes(s))snare(tt,true);hat(tt,s===7||s===15,s%2===1);if(s%2===0)hat(tt+.008,false,false);if(!currentChord)return;let r=currentChord.base-24;let line={0:[0,'accent'],2:[12,'ghost'],3:[7,'main'],5:[-1,'ghost'],6:[0,'main'],8:[12,'accent'],10:[7,'main'],11:[10,'ghost'],13:[12,'main'],15:[-1,'ghost']}[s];if(line)bass(tt,r+line[0],line[1]);if([2,6,10,15].includes(s))rhodes(tt,currentChord,s===15?.28:.13)}function scheduler(){if(!running)return;let six=60/Number(bpm.value)/4;while(nextTime<ac.currentTime+.12){schedule(step,nextTime);let v=step,delay=Math.max(0,(nextTime-ac.currentTime)*1000);setTimeout(()=>[...meter.children].forEach((x,i)=>x.classList.toggle('on',i===v)),delay);nextTime+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}async function toggle(){await audio();running=!running;groove.dataset.on=running;groove.textContent=running?'■ STOP':'▶ GROOVE';if(running){step=0;nextTime=ac.currentTime+.05;scheduler()}else{clearTimeout(timer);[...meter.children].forEach(x=>x.classList.remove('on'))}stat()}async function hit(i,seventh=shift){await audio();let c=cur[i];if(!c)return;currentChord=c;let q=seventh?c.sev:c.tri,l=lab(c.root,q),now=ac.currentTime+.005;rhodes(now,c,.38);bass(now,c.base-24,'accent');sel.push(l);if(sel.length>12)sel.shift();draw();let b=pads.children[i];b.dataset.active='true';setTimeout(()=>b.dataset.active='false',130);stat()}function render(){meta.textContent=key.value+' / '+scale.options[scale.selectedIndex].text;pads.replaceChildren(...cur.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<div class="degree">'+DEG[i]+'</div><div class="chord-name base">'+lab(c.root,c.tri)+'</div><div class="chord-name seventh">'+lab(c.root,c.sev)+'</div><div class="key-label">'+LABELS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();hit(i,e.shiftKey||shift)};return b}))}function draw(){if(!sel.length){prog.textContent='コードを弾くと進行が残ります。';return}prog.replaceChildren(...sel.map(x=>{let z=document.createElement('span');z.textContent=x;return z}))}function stat(){status.textContent=(running?'GROOVE ON':'GROOVE OFF')+' · '+bpm.value+' BPM · BOUNCE '+swing.value+' · BASS '+bassLevel.value+'%'}function setShift(v){shift=v;app.classList.toggle('shift-on',v);stat()}groove.onclick=toggle;key.value='C';key.onchange=build;scale.onchange=build;[bpm,swing,bassLevel].forEach(x=>x.oninput=stat);document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.key==='Shift')setShift(true);if(e.repeat||e.metaKey||e.ctrlKey||e.altKey)return;let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();hit(i,e.shiftKey)}});document.addEventListener('keyup',e=>{if(e.key==='Shift')setShift(false)});window.addEventListener('blur',()=>setShift(false));build();stat();</script></body></html>
