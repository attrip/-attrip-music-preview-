<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Music</title><style>:root{color-scheme:light dark;font-family:system-ui,-apple-system,sans-serif}body{margin:0;padding:24px}.app{max-width:820px;margin:auto;display:grid;gap:16px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:.1em;opacity:.6}h1{margin:0;font-size:clamp(30px,6vw,58px)}.controls{display:flex;gap:8px}select,button{font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:12px}select{padding:10px}.hint{font-size:13px;opacity:.65}.chords{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}.chord{height:130px;position:relative;font-weight:800;cursor:pointer}.chord kbd{position:absolute;bottom:8px;left:0;right:0;font-size:12px;opacity:.55}.chord[data-active=true]{transform:translateY(3px);background:color-mix(in srgb,currentColor 10%,transparent)}.progression{display:flex;gap:7px;flex-wrap:wrap;min-height:42px;align-items:center}.progression span{padding:6px 10px;border:1px solid currentColor;border-radius:999px}@media(max-width:650px){.chords{grid-template-columns:repeat(4,1fr)}.chord{height:90px}}</style></head><body><main class="app"><div><div class="eyebrow">ATTRIP / MUSIC PREVIEW</div><h1>コードを、触る。</h1><p id="meta"></p></div><div class="controls"><select id="key" aria-label="キー"></select><select id="scale" aria-label="スケール"><option value="major">Major</option><option value="minor">Natural Minor</option></select></div><div class="hint">A S D F G H J = 左から右へ I–VII。Shift + キー = 7th。ピアノの白鍵のように横へ弾く。</div><div class="chords" id="chords"></div><div class="progression" id="progression">コードを弾くと進行が残ります。</div></main><script>const N=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'],S={major:{i:[0,2,4,5,7,9,11],q:['maj','min','min','maj','maj','min','dim'],s:['maj7','min7','min7','maj7','7','min7','m7b5']},minor:{i:[0,2,3,5,7,8,10],q:['min','dim','maj','min','min','maj','maj'],s:['min7','m7b5','maj7','min7','min7','maj7','7']}},T={maj:[0,4,7],min:[0,3,7],dim:[0,3,6],maj7:[0,4,7,11],min7:[0,3,7,10],'7':[0,4,7,10],m7b5:[0,3,6,10]},K=['a','s','d','f','g','h','j'];let audio,cur=[],sel=[];const key=document.querySelector('#key'),scale=document.querySelector('#scale'),box=document.querySelector('#chords'),prog=document.querySelector('#progression'),meta=document.querySelector('#meta');N.forEach(n=>key.add(new Option(n,n)));function lab(r,q){return q==='min'?r+'m':q==='dim'?r+'dim':q==='maj7'?r+'maj7':q==='min7'?r+'m7':q==='m7b5'?r+'m7♭5':q==='7'?r+'7':r}function build(){let r=N.indexOf(key.value),s=S[scale.value];cur=s.i.map((v,d)=>{let a=r+v;return{root:N[a%12],tri:s.q[d],sev:s.s[d],base:60+a}});sel=[];draw();render()}function notes(c,q){return T[q].map(x=>c.base+x)}function play(ns){audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let t=audio.currentTime;ns.forEach((m,i)=>{let o=audio.createOscillator(),g=audio.createGain();o.type=i?'sine':'triangle';o.frequency.value=440*Math.pow(2,(m-69)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.055,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.9);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.94)})}function hit(i,seventh=false){let c=cur[i];if(!c)return,q=seventh?c.sev:c.tri,l=lab(c.root,q);play(notes(c,q));sel.push(l);if(sel.length>12)sel.shift();draw();let b=box.children[i];b.dataset.active='true';setTimeout(()=>b.dataset.active='false',120)}function render(){meta.textContent=key.value+' / '+scale.options[scale.selectedIndex].text;box.replaceChildren(...cur.map((c,i)=>{let b=document.createElement('button');b.className='chord';b.innerHTML='<span>'+lab(c.root,c.tri)+'</span><kbd>'+K[i].toUpperCase()+'</kbd>';b.onclick=e=>hit(i,e.shiftKey);return b}))}function draw(){if(!sel.length){prog.textContent='コードを弾くと進行が残ります。';return}prog.replaceChildren(...sel.map(x=>{let s=document.createElement('span');s.textContent=x;return s}))}key.value='C';key.onchange=build;scale.onchange=build;document.addEventListener('keydown',e=>{if(e.repeat||e.metaKey||e.ctrlKey||e.altKey||/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;let i=K.indexOf(e.key.toLowerCase());if(i>=0){e.preventDefault();hit(i,e.shiftKey)}});build();</script></body></html>
