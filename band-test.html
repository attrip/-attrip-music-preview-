<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Band Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;padding:24px}.box{width:min(1080px,96vw);background:#f3f3f0;color:#171717;border-radius:30px;padding:30px}.title{font-size:30px;font-weight:900}.sub,.hint{font-size:12px;opacity:.58;line-height:1.65}.pads{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}.pad{height:130px;border:1px solid #aaa;border-radius:16px;background:#fff;font:inherit}.pad.on{background:#dcd8ff;transform:translateY(3px)}.pad b{font-size:25px}.pad span{display:block;font-size:10px;opacity:.55;margin-top:8px}.controls{margin-top:22px;border-top:1px solid #ccc;padding-top:20px;display:flex;justify-content:space-between;gap:15px;align-items:center}.play{font:inherit;border:1px solid #aaa;background:#fff;border-radius:12px;padding:12px 18px}.play.on{background:#111;color:#fff}.status{font-size:11px;opacity:.65;margin-top:5px}.parts{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.parts span{font-size:10px;border:1px solid #bbb;border-radius:999px;padding:6px 9px}.parts span.on{background:#111;color:#fff}.hint{margin-top:18px}@media(max-width:650px){.pads{grid-template-columns:repeat(2,1fr)}.controls{align-items:start;flex-direction:column}}</style></head><body><main class="box"><div class="title">BAND INTEGRATION TEST</div><div class="sub">REAL PIANO + FINGER BASS + DRUM POCKET。Bassは P1 → P1 → P2 → P3。</div><div class="pads" id="pads"></div><div class="parts"><span class="on">REAL PIANO</span><span class="on">FINGER BASS</span><span class="on">DRUM POCKET</span><span id="pattern">BASS P1</span></div><div class="controls"><div><b id="now">Dm9</b><div class="status" id="status">SpaceでBand開始</div></div><button class="play" id="play">SPACE · BAND</button></div><div class="hint">A/S/D/Fでコード変更。Spaceで開始/停止。<br>今回は音を足さず、この3パートだけ。「鍵盤を押したら後ろでバンドが演奏している」と感じるかだけ確認します。</div></main><script>const CH=[{n:'Dm9',r:38,v:[53,60,64,69]},{n:'G13',r:43,v:[53,59,64,69]},{n:'Cmaj9',r:36,v:[52,59,62,67]},{n:'A13',r:45,v:[55,61,66,71]}],KEYS=['KeyA','KeyS','KeyD','KeyF'],LAB=['A','S','D','F'];const PROOT='https://unpkg.com/@audio-samples/piano-velocity8@1.0.5/audio/',PM=[36,39,42,45,48,51,54,57,60,63,66,69,72,75,78,81,84];const BROOT='https://raw.githubusercontent.com/freepats/electric-bass-YR/main/samples/finger/',BM={28:'E.flac',29:'F.flac',30:'F%23.flac',31:'G.flac',32:'G%23.flac',33:'A.flac',34:'A%23.flac',35:'B.flac',36:'C.flac',37:'C%23.flac',38:'D.flac',39:'D%23.flac'};const BP=[[0,null,0,3,null,5,null,3,0,null,7,null,5,3,null,0],[0,null,0,3,null,5,null,3,0,null,7,null,5,3,null,0],[0,null,null,3,5,null,null,3,0,null,7,null,null,3,null,0],[0,'g',0,3,'g',5,null,3,0,'g',7,null,5,3,'g',0]];let ac,master,pbus,bbus,pc=new Map(),bc=new Map(),running=false,timer,next=0,step=0,bar=0,current=0,queued=null;const $=s=>document.querySelector(s),pads=$('#pads'),status=$('#status'),play=$('#play'),now=$('#now'),pattern=$('#pattern');function pfile(m){let names={0:'C',3:'D%23',6:'F%23',9:'A'};return names[m%12]+(Math.floor(m/12)-1)+'v8.ogg'}function nearest(a,m){return a.reduce((x,y)=>Math.abs(y-m)<Math.abs(x-m)?y:x)}async function audio(){if(!ac){ac=new AudioContext();master=ac.createDynamicsCompressor();master.threshold.value=-15;master.ratio.value=3;master.connect(ac.destination);pbus=ac.createGain();pbus.gain.value=.85;pbus.connect(master);bbus=ac.createGain();bbus.gain.value=.9;bbus.connect(master)}if(ac.state==='suspended')await ac.resume()}async function lp(m){let sm=nearest(PM,m);if(pc.has(sm))return[pc.get(sm),sm];let r=await fetch(PROOT+pfile(sm));if(!r.ok)throw Error('PIANO '+r.status);let b=await ac.decodeAudioData(await r.arrayBuffer());pc.set(sm,b);return[b,sm]}async function lb(m){let ks=Object.keys(BM).map(Number),sm=nearest(ks,m);if(bc.has(sm))return[bc.get(sm),sm];let r=await fetch(BROOT+BM[sm]);if(!r.ok)throw Error('BASS '+r.status);let b=await ac.decodeAudioData(await r.arrayBuffer());bc.set(sm,b);return[b,sm]}async function piano(m,t,d=.38,v=.55){let[b,sm]=await lp(m),s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.playbackRate.value=2**((m-sm)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.075*v,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g).connect(pbus);s.start(t);s.stop(t+d+.04)}async function bass(m,t,d=.15,v=.8){let[b,sm]=await lb(m),s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.playbackRate.value=2**((m-sm)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.30*v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g).connect(bbus);s.start(t);s.stop(t+d+.04)}function noise(t,d,v,hp){let b=ac.createBuffer(1,ac.sampleRate*d,ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.exp(-i/a.length*7);let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(f).connect(g).connect(master);s.start(t)}function kick(t){let o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(105,t);o.frequency.exponentialRampToValueAtTime(48,t+.075);g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.0001,t+.15);o.connect(g).connect(master);o.start(t);o.stop(t+.17)}function ghost(t){noise(t,.04,.045,500)}function sched(i,t){if(i===0){if(queued!==null){current=queued;queued=null;draw()}pattern.textContent='BASS P'+([1,1,2,3][bar%4]);}let ch=CH[current],p=BP[bar%4],x=p[i];if(x==='g')ghost(t);else if(x!=null){let intervals=[0,2,3,5,7,10,12,14],m=ch.r+intervals[x];bass(m,t,i%4===0?.23:.14,i===0?1:.75).catch(e=>status.textContent=e.message)}if([0,4,8,12].includes(i))ch.v.forEach(m=>piano(m,t,.34,.5).catch(()=>{}));if([0,6,8,11,14].includes(i))kick(t);if([4,12].includes(i))noise(t+.005,.10,.10,700);if(i%2===0)noise(t,.022,.018,6500);if(i===15)bar++}function scheduler(){if(!running)return;let six=60/104/4;while(next<ac.currentTime+.11){sched(step,next);next+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}function draw(){[...pads.children].forEach((b,i)=>b.classList.toggle('on',i===current));now.textContent=CH[current].n+(queued!==null?' → '+CH[queued].n:'')}pads.replaceChildren(...CH.map((c,i)=>{let b=document.createElement('button');b.className='pad';b.innerHTML='<b>'+c.n+'</b><span>'+LAB[i]+'</span>';b.onclick=()=>{if(running){queued=i;draw()}else{current=i;draw()}};return b}));async function toggle(){await audio();running=!running;play.classList.toggle('on',running);play.textContent=running?'SPACE · STOP':'SPACE · BAND';if(running){status.textContent='Loading Piano + Bass…';try{await Promise.all([36,38,43,45,53,59,60,64,67,69].map(lp));await Promise.all([28,31,33,35,36,38,39].map(lb));status.textContent='BAND READY'}catch(e){status.textContent='LOAD FAILED: '+e.message;running=false;return}step=0;bar=0;next=ac.currentTime+.05;scheduler()}else{clearTimeout(timer);status.textContent='STOPPED'}}play.onclick=toggle;document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();toggle();return}let i=KEYS.indexOf(e.code);if(i>=0){e.preventDefault();if(running)queued=i;else current=i;draw()}});draw();</script></body></html>
