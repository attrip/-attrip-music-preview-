<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Issue #2 Immersion Diagnostic</title><style>body{margin:0;min-height:100vh;background:#080808;color:#111;font-family:ui-monospace,monospace;display:grid;place-items:center}.box{width:min(980px,94vw);background:#f3f3ef;border-radius:28px;padding:28px}.choices,.pads{display:flex;gap:10px;flex-wrap:wrap}.choice,.pad,.play{border:1px solid #aaa;background:#fff;border-radius:14px;font:inherit}.choice{flex:1;min-width:220px;padding:16px}.choice.on,.play.on{background:#111;color:#fff}.choice b{display:block;font-size:18px;margin-bottom:6px}.choice span,.sub,.status,.hint{font-size:12px;opacity:.66;line-height:1.55}.pads{margin-top:22px}.pad{flex:1;min-width:150px;height:110px;touch-action:none}.pad.on{background:#ddd8ff;transform:translateY(3px)}.pad b{font-size:24px}.controls{margin-top:20px;padding-top:18px;border-top:1px solid #ccc;display:flex;justify-content:space-between;align-items:center;gap:12px}.play{padding:12px 18px}.hint{margin-top:16px}</style></head><body><main class="box"><h1>ISSUE #2 · IMMERSION TEST</h1><div class="sub">同じPiano / Bass / Drums。変えるのは「和音が消えた直後に何が残るか」だけ。</div><div class="choices"><button class="choice on" data-mode="A"><b>A · BASELINE</b><span>現状。Piano release 0.72秒。</span></button><button class="choice" data-mode="B"><b>B · HARMONIC TAIL</b><span>Pianoの余韻だけ2.0秒に延長。</span></button><button class="choice" data-mode="C"><b>C · BASS EXPOSURE OFF</b><span>Pianoを離した直後だけBassを約1秒抑える。</span></button></div><div class="pads" id="pads"></div><div class="controls"><div><b id="now">A · Dm9</b><div class="status" id="status">SpaceでBand開始。A/S/D/FでPiano。</div></div><button class="play" id="play">SPACE · BAND</button></div><div class="hint">再生中に 1 / 2 / 3 で瞬時に切替できます。今回は「どれが一番、急に単音練習っぽくならないか」だけを聴いてください。</div></main><script>
const CH=[{n:'Dm9',r:38,v:[53,60,64,69]},{n:'G13',r:43,v:[53,59,64,69]},{n:'Cmaj9',r:36,v:[52,59,62,67]},{n:'A13',r:45,v:[55,61,66,71]}];
const KEYS=['KeyA','KeyS','KeyD','KeyF'];
const PROOT='https://unpkg.com/@audio-samples/piano-velocity8@1.0.5/audio/';
const PM=[36,39,42,45,48,51,54,57,60,63,66,69,72,75,78,81,84];
const BROOT='https://raw.githubusercontent.com/freepats/electric-bass-YR/main/samples/finger/';
const BM={28:'E.flac',29:'F.flac',30:'F%23.flac',31:'G.flac',32:'G%23.flac',33:'A.flac',34:'A%23.flac',35:'B.flac',36:'C.flac',37:'C%23.flac',38:'D.flac',39:'D%23.flac'};
const GROOVE={bass:[0,null,0,3,null,5,null,3,0,null,7,null,5,3,null,0],kick:[0,6,8,11,14],sn:[4,12],hat:[0,2,4,6,8,10,12,14]};
let ac,master,pbus,bbus,pc=new Map(),bc=new Map(),running=false,timer,next=0,step=0,current=0,mode='A',held=[],bassMuteUntil=0;
const $=s=>document.querySelector(s),pads=$('#pads'),status=$('#status'),play=$('#play'),now=$('#now');
function near(arr,m){return arr.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a)}
function pfile(m){const names={0:'C',3:'D%23',6:'F%23',9:'A'};return names[m%12]+(Math.floor(m/12)-1)+'v8.ogg'}
async function initAudio(){if(!ac){const AC=window.AudioContext||window.webkitAudioContext;ac=new AC();master=ac.createDynamicsCompressor();master.threshold.value=-12;master.ratio.value=2.2;master.connect(ac.destination);pbus=ac.createGain();pbus.gain.value=1.25;pbus.connect(master);bbus=ac.createGain();bbus.gain.value=.86;bbus.connect(master)}if(ac.state==='suspended')await ac.resume()}
async function loadPiano(m){const sm=near(PM,m);if(pc.has(sm))return[pc.get(sm),sm];const r=await fetch(PROOT+pfile(sm));if(!r.ok)throw new Error('PIANO '+r.status);const b=await ac.decodeAudioData(await r.arrayBuffer());pc.set(sm,b);return[b,sm]}
async function loadBass(m){const ks=Object.keys(BM).map(Number),sm=near(ks,m);if(bc.has(sm))return[bc.get(sm),sm];const r=await fetch(BROOT+BM[sm]);if(!r.ok)throw new Error('BASS '+r.status);const b=await ac.decodeAudioData(await r.arrayBuffer());bc.set(sm,b);return[b,sm]}
async function pianoVoice(m,t){const [b,sm]=await loadPiano(m),s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.playbackRate.value=Math.pow(2,(m-sm)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.115,t+.006);g.gain.exponentialRampToValueAtTime(.065,t+.18);s.connect(g).connect(pbus);s.start(t);return{s,g}}
function releasePiano(){if(!ac)return;const t=ac.currentTime,rel=mode==='B'?2.0:.72;if(mode==='C')bassMuteUntil=t+1.0;held.splice(0).forEach(v=>{try{v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(Math.max(.0001,v.g.gain.value||.04),t);v.g.gain.exponentialRampToValueAtTime(.0001,t+rel);v.s.stop(t+rel+.06)}catch{}});pads.querySelectorAll('.pad').forEach(x=>x.classList.remove('on'))}
async function pressChord(i){await initAudio();current=i;releasePiano();bassMuteUntil=0;const t=ac.currentTime+.01;try{held=await Promise.all(CH[i].v.map(m=>pianoVoice(m,t)));pads.children[i].classList.add('on');status.textContent='YOU PLAY · '+CH[i].n}catch(e){status.textContent=e.message}draw()}
async function bass(m,t,d=.17,v=.82){if(mode==='C'&&t<bassMuteUntil)return;const [b,sm]=await loadBass(m),s=ac.createBufferSource(),g=ac.createGain();s.buffer=b;s.playbackRate.value=Math.pow(2,(m-sm)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.25*v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g).connect(bbus);s.start(t);s.stop(t+d+.04)}
function noise(t,d,v,hp){const tt=Math.max(t,ac.currentTime),b=ac.createBuffer(1,Math.ceil(ac.sampleRate*d),ac.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*Math.exp(-7*i/a.length);const s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='highpass';f.frequency.value=hp;g.gain.setValueAtTime(v,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+d);s.connect(f).connect(g).connect(master);s.start(tt);s.stop(tt+d+.02)}
function kick(t){const tt=Math.max(t,ac.currentTime),o=ac.createOscillator(),g=ac.createGain();o.frequency.setValueAtTime(96,tt);o.frequency.exponentialRampToValueAtTime(50,tt+.06);g.gain.setValueAtTime(.17,tt);g.gain.exponentialRampToValueAtTime(.0001,tt+.13);o.connect(g).connect(master);o.start(tt);o.stop(tt+.16)}
function sched(i,t){const ch=CH[current],x=GROOVE.bass[i];if(x!=null){const ints=[0,2,3,5,7,10,12,14];bass(ch.r+ints[x],t,i%4===0?.21:.14,(i===0||i===8)?1:.74).catch(e=>status.textContent=e.message)}if(GROOVE.kick.includes(i))kick(t);if(GROOVE.sn.includes(i))noise(t+.004,.09,.085,700);if(GROOVE.hat.includes(i))noise(t,.022,.017,6500)}
function scheduler(){if(!running)return;const six=60/104/4;while(next<ac.currentTime+.1){sched(step,next);next+=six;step=(step+1)%16}timer=setTimeout(scheduler,20)}
function setMode(m){mode=m;bassMuteUntil=0;document.querySelectorAll('.choice').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));draw()}
function draw(){now.textContent=mode+' · '+CH[current].n}
document.querySelectorAll('.choice').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
pads.replaceChildren(...CH.map((c,i)=>{const b=document.createElement('button');b.className='pad';b.innerHTML='<b>'+c.n+'</b><br><span>'+['A','S','D','F'][i]+'</span>';b.onpointerdown=e=>{e.preventDefault();pressChord(i)};b.onpointerup=releasePiano;b.onpointercancel=releasePiano;return b}));
async function preload(){Promise.all([...new Set(CH.flatMap(c=>c.v))].map(loadPiano)).catch(e=>status.textContent=e.message);Promise.all([28,31,33,35,36,38,39].map(loadBass)).catch(e=>status.textContent=e.message)}
async function toggle(){await initAudio();if(running){running=false;clearTimeout(timer);play.classList.remove('on');play.textContent='SPACE · BAND';status.textContent='BAND STOPPED';return}running=true;step=0;next=ac.currentTime+.06;play.classList.add('on');play.textContent='SPACE · STOP';status.textContent='BAND ON · A/S/D/FでPiano';scheduler();preload()}
play.onclick=toggle;
document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();toggle();return}if(e.code==='Digit1'){setMode('A');return}if(e.code==='Digit2'){setMode('B');return}if(e.code==='Digit3'){setMode('C');return}const i=KEYS.indexOf(e.code);if(i>=0){e.preventDefault();pressChord(i)}});
document.addEventListener('keyup',e=>{if(KEYS.includes(e.code)){e.preventDefault();releasePiano()}});
window.addEventListener('blur',releasePiano);draw();
</script></body></html>
