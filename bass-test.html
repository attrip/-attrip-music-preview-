<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Bass Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;padding:24px}.box{width:min(980px,96vw);background:#f3f3f0;color:#171717;border-radius:28px;padding:30px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end}.title{font-size:30px;font-weight:900}.sub{font-size:12px;opacity:.55;margin-top:6px}.switch{display:flex;gap:8px}.switch button,.play{font:inherit;border:1px solid #aaa;background:#fff;border-radius:12px;padding:10px 14px}.switch button.on,.play.on{background:#111;color:#fff}.notes{display:grid;grid-template-columns:repeat(8,1fr);gap:8px;margin-top:28px}.note{height:105px;border:1px solid #aaa;border-radius:15px;background:#fff;font:inherit;cursor:pointer}.note.down{background:#dcd8ff;transform:translateY(3px)}.n{font-size:22px;font-weight:900}.k{font-size:11px;opacity:.45;margin-top:8px}.groove{margin-top:22px;border-top:1px solid #ccc;padding-top:20px;display:flex;justify-content:space-between;gap:14px;align-items:center}.status{font-size:12px;opacity:.65}.hint{font-size:12px;opacity:.55;line-height:1.65;margin-top:20px}@media(max-width:680px){.top,.groove{align-items:start;flex-direction:column}.notes{grid-template-columns:repeat(4,1fr)}}</style></head><body><main class="box"><div class="top"><div><div class="title">BASS SOUND TEST</div><div class="sub">音源だけ比べる。グルーヴは同じ。</div></div><div class="switch"><button class="on" data-e="sample">1 · FINGER BASS</button><button data-e="synth">2 · SYNTH</button></div></div><div class="notes" id="notes"></div><div class="groove"><div><div style="font-weight:900">FUNK LOOP</div><div class="status" id="status">1 · FINGER BASS / loading on first play</div></div><button class="play" id="loop">SPACE · LOOP</button></div><div class="hint">A S D F G H J K = 単音。Space = 同じベースラインをループ。<br>Finger Bass YR: Yamaha RBX bass guitar samples / FreePats / CC0。まず「音そのものが前より生っぽいか」だけ確認してください。</div></main><script>const KEYS=['KeyA','KeyS','KeyD','KeyF','KeyG','KeyH','KeyJ','KeyK'],LABEL=['A','S','D','F','G','H','J','K'];const MIDIS=[28,31,33,35,36,38,39,40],NAMES=['E1','G1','A1','B1','C2','D2','D#2','E2'];const ROOT='https://raw.githubusercontent.com/freepats/electric-bass-YR/main/samples/finger/';const MAP={28:['E.flac',28],29:['F.flac',29],30:['F%23.flac',30],31:['G.flac',31],32:['G%23.flac',32],33:['A.flac',33],34:['A%23.flac',34],35:['B.flac',35],36:['C.flac',36],37:['C%23.flac',37],38:['D.flac',38],39:['D%23.flac',39]};let ac,master,engine='sample',cache=new Map(),active=[],looping=false,timer=null,next=0,step=0;const notes=document.querySelector('#notes'),status=document.querySelector('#status'),loop=document.querySelector('#loop');async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-15;master.ratio.value=3;master.connect(ac.destination)}if(ac.state==='suspended')await ac.resume()}function nearest(m){let ks=Object.keys(MAP).map(Number);return ks.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a)}async function load(sm){if(cache.has(sm))return cache.get(sm);let [file]=MAP[sm],r=await fetch(ROOT+file);if(!r.ok)throw new Error('HTTP '+r.status+' '+file);let b=await ac.decodeAudioData(await r.arrayBuffer());cache.set(sm,b);return b}async function sample(m,t,d=.55,v=.8){let sm=nearest(m),buf=await load(sm),src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;src.playbackRate.value=Math.pow(2,(m-sm)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.38*v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);src.connect(g).connect(master);src.start(t);src.stop(t+d+.05);active.push(src)}function synth(m,t,d=.55,v=.8){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type='sawtooth';o.frequency.value=440*Math.pow(2,(m-69)/12);f.type='lowpass';f.frequency.value=650;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.16*v,t+.006);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(f).connect(g).connect(master);o.start(t);o.stop(t+d+.05);active.push(o)}async function play(m,d=.55,v=.8){await audio();let t=ac.currentTime+.01;try{if(engine==='sample'){await sample(m,t,d,v);status.textContent='1 · FINGER BASS ready'}else{synth(m,t,d,v);status.textContent='2 · SYNTH'}}catch(e){status.textContent='LOAD FAILED: '+e.message}}document.querySelectorAll('.switch button').forEach(b=>b.onclick=()=>{engine=b.dataset.e;document.querySelectorAll('.switch button').forEach(x=>x.classList.toggle('on',x===b));status.textContent=engine==='sample'?'1 · FINGER BASS':'2 · SYNTH'});notes.replaceChildren(...MIDIS.map((m,i)=>{let b=document.createElement('button');b.className='note';b.innerHTML='<div class="n">'+NAMES[i]+'</div><div class="k">'+LABEL[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();b.classList.add('down');play(m,.75,.9)};b.onpointerup=()=>b.classList.remove('down');b.onpointercancel=()=>b.classList.remove('down');return b}));const LINE=[28,null,28,31,33,null,31,28,35,null,33,31,28,33,35,31];function sched(s,t){let m=LINE[s];if(m==null)return;let accent=[0,4,8,12].includes(s);if(engine==='sample')sample(m,t,accent?.32:.21,accent?1:.72).catch(e=>status.textContent='LOAD FAILED: '+e.message);else synth(m,t,accent?.32:.21,accent?1:.72)}function scheduler(){if(!looping)return;let six=60/104/4;while(next<ac.currentTime+.12){sched(step,next);next+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}async function toggle(){await audio();looping=!looping;loop.classList.toggle('on',looping);loop.textContent=looping?'SPACE · STOP':'SPACE · LOOP';if(looping){if(engine==='sample'){status.textContent='1 · FINGER BASS loading…';try{await Promise.all([28,31,33,35].map(x=>load(x)));status.textContent='1 · FINGER BASS ready'}catch(e){status.textContent='LOAD FAILED: '+e.message;looping=false;loop.classList.remove('on');loop.textContent='SPACE · LOOP';return}}step=0;next=ac.currentTime+.05;scheduler()}else clearTimeout(timer)}loop.onclick=toggle;document.addEventListener('keydown',e=>{if(e.code==='Space'&&!e.repeat){e.preventDefault();toggle();return}if(e.repeat)return;let i=KEYS.indexOf(e.code);if(i>=0){e.preventDefault();document.querySelectorAll('.note')[i].classList.add('down');play(MIDIS[i],.75,.9)}});document.addEventListener('keyup',e=>{let i=KEYS.indexOf(e.code);if(i>=0)document.querySelectorAll('.note')[i].classList.remove('down')});</script></body></html>
