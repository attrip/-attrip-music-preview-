<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Bass Groove Test</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;padding:24px}.box{width:min(1000px,96vw);background:#f3f3f0;color:#171717;border-radius:28px;padding:30px}.title{font-size:30px;font-weight:900}.sub,.hint{font-size:12px;opacity:.58;line-height:1.65}.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:25px}.mode{min-height:105px;border:1px solid #aaa;background:#fff;border-radius:15px;font:inherit;padding:12px;cursor:pointer}.mode.on{background:#111;color:#fff}.mode b{display:block;font-size:17px;margin-bottom:7px}.mode span{font-size:10px;opacity:.65}.groove{margin-top:22px;border-top:1px solid #ccc;padding-top:20px;display:flex;justify-content:space-between;gap:14px;align-items:center}.play{font:inherit;border:1px solid #aaa;background:#fff;border-radius:12px;padding:12px 18px}.play.on{background:#111;color:#fff}.status{font-size:12px;opacity:.65;margin-top:5px}.meter{display:grid;grid-template-columns:repeat(16,1fr);gap:4px;margin-top:24px}.step{height:35px;background:#ddd;border-radius:5px;display:grid;place-items:center;font-size:9px}.step.on{background:#222;color:#fff}.hint{margin-top:20px}@media(max-width:700px){.modes{grid-template-columns:repeat(2,1fr)}.groove{align-items:start;flex-direction:column}}</style></head><body><main class="box"><div class="title">BASS GROOVE DECISION</div><div class="sub">音源は全部同じFinger Bass。変えるのは弾き方だけ。</div><div class="modes"><button class="mode on" data-mode="A"><b>A · STRAIGHT</b><span>基準。シンプルな8分寄り</span></button><button class="mode" data-mode="B"><b>B · SYNCOPATED</b><span>16分の先取りと休符</span></button><button class="mode" data-mode="C"><b>C · + GHOST</b><span>短いミュート音を追加</span></button><button class="mode" data-mode="D"><b>D · + MOVE</b><span>Octave + chromatic approach</span></button></div><div class="meter" id="meter"></div><div class="groove"><div><b id="now">A · STRAIGHT</b><div class="status" id="status">Finger Bass / first play loads samples</div></div><button class="play" id="play">SPACE · PLAY</button></div><div class="hint">Spaceで再生/停止。再生中もA/B/C/Dまたは1/2/3/4で即切替できます。<br>判断するのは「複雑さ」ではなく、どれが一番身体が動くか。Finger Bass YR / FreePats / CC0。</div></main><script>const ROOT='https://raw.githubusercontent.com/freepats/electric-bass-YR/main/samples/finger/';const MAP={28:'E.flac',29:'F.flac',30:'F%23.flac',31:'G.flac',32:'G%23.flac',33:'A.flac',34:'A%23.flac',35:'B.flac',36:'C.flac',37:'C%23.flac',38:'D.flac',39:'D%23.flac'};const P={A:[28,null,28,null,33,null,31,null,28,null,35,null,33,null,31,null],B:[28,null,28,31,null,33,null,31,28,null,35,null,33,31,null,28],C:[28,'g',28,31,'g',33,null,31,28,'g',35,null,33,31,'g',28],D:[28,'g',40,31,'g',33,32,31,28,'g',35,33,32,31,27,28]};let ac,master,cache=new Map(),mode='A',running=false,timer,next=0,step=0;const status=document.querySelector('#status'),play=document.querySelector('#play'),now=document.querySelector('#now'),meter=document.querySelector('#meter');async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-14;master.ratio.value=3;master.connect(ac.destination)}if(ac.state==='suspended')await ac.resume()}function nearest(m){let ks=Object.keys(MAP).map(Number);return ks.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a)}async function load(m){let sm=nearest(m);if(cache.has(sm))return[cache.get(sm),sm];let r=await fetch(ROOT+MAP[sm]);if(!r.ok)throw new Error('HTTP '+r.status);let buf=await ac.decodeAudioData(await r.arrayBuffer());cache.set(sm,buf);return[buf,sm]}async function note(m,t,d=.18,v=.8){let[buf,sm]=await load(m),s=ac.createBufferSource(),g=ac.createGain();s.buffer=buf;s.playbackRate.value=Math.pow(2,(m-sm)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.34*v,t+.004);g.gain.exponentialRampToValueAtTime(.0001,t+d);s.connect(g).connect(master);s.start(t);s.stop(t+d+.04)}function ghost(t){let b=ac.createBuffer(1,Math.ceil(ac.sampleRate*.045),ac.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/d.length*7);let s=ac.createBufferSource(),f=ac.createBiquadFilter(),g=ac.createGain();s.buffer=b;f.type='bandpass';f.frequency.value=900;g.gain.value=.07;s.connect(f).connect(g).connect(master);s.start(t)}function sched(i,t){let x=P[mode][i];if(x==='g')ghost(t);else if(x!=null)note(x,t,[0,4,8,12].includes(i)?.27:.15,[0,8].includes(i)?1:.76).catch(e=>status.textContent='LOAD FAILED: '+e.message);paint(i)}function scheduler(){if(!running)return;let six=60/104/4;while(next<ac.currentTime+.11){sched(step,next);next+=six;step=(step+1)%16}timer=setTimeout(scheduler,22)}function paint(i){[...meter.children].forEach((x,n)=>x.classList.toggle('on',n===i))}function draw(){meter.innerHTML='';P[mode].forEach((x,i)=>{let d=document.createElement('div');d.className='step';d.textContent=x==='g'?'x':x==null?'·':i%4===0?'●':'•';meter.appendChild(d)})}function setMode(m){mode=m;document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('on',b.dataset.mode===m));now.textContent=m+' · '+({A:'STRAIGHT',B:'SYNCOPATED',C:'+ GHOST',D:'+ MOVE'}[m]);draw()}document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));async function toggle(){await audio();running=!running;play.classList.toggle('on',running);play.textContent=running?'SPACE · STOP':'SPACE · PLAY';if(running){status.textContent='Finger Bass loading…';try{await Promise.all([28,31,32,33,35,39].map(load));status.textContent='Finger Bass ready'}catch(e){status.textContent='LOAD FAILED: '+e.message;running=false;play.classList.remove('on');play.textContent='SPACE · PLAY';return}step=0;next=ac.currentTime+.05;scheduler()}else{clearTimeout(timer);paint(-1)}}play.onclick=toggle;document.addEventListener('keydown',e=>{if(e.repeat)return;if(e.code==='Space'){e.preventDefault();toggle();return}let map={KeyA:'A',KeyB:'B',KeyC:'C',KeyD:'D',Digit1:'A',Digit2:'B',Digit3:'C',Digit4:'D'};if(map[e.code])setMode(map[e.code])});draw();</script></body></html>
