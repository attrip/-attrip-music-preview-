<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ATTRIP Sound Decision</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#090909;color:#eee;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;display:grid;place-items:center;padding:24px}.box{width:min(980px,96vw);background:#f3f3f0;color:#171717;border-radius:30px;padding:32px}.top{display:flex;justify-content:space-between;gap:18px;align-items:end}.title{font-size:30px;font-weight:900}.sub{font-size:12px;opacity:.55;margin-top:5px}.engines{display:flex;gap:8px;flex-wrap:wrap}.engine{padding:10px 15px;border:1px solid #aaa;border-radius:12px;background:#fff;font:inherit}.engine.on{background:#111;color:#fff}.chords{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:32px}.chord{height:170px;border:1px solid #aaa;border-radius:18px;background:#fff;font:inherit;cursor:pointer}.chord:active,.chord.down{transform:translateY(4px);background:#dedaff}.name{font-size:32px;font-weight:900}.key{font-size:12px;opacity:.45;margin-top:15px}.status{text-align:center;margin:22px 0 12px;font-size:12px;opacity:.65}.score{border-top:1px solid #ccc;padding-top:20px;margin-top:22px}.score h2{font-size:13px;margin:0 0 12px}.rows{display:grid;grid-template-columns:1fr repeat(5,38px);gap:6px;align-items:center}.rows button{border:1px solid #bbb;background:#fff;border-radius:8px;padding:7px}.rows button.sel{background:#111;color:#fff}.note{font-size:12px;opacity:.55;line-height:1.6;margin-top:20px}@media(max-width:650px){.top{align-items:start;flex-direction:column}.chords{grid-template-columns:repeat(2,1fr)}.chord{height:130px}}</style></head><body><main class="box"><div class="top"><div><div class="title">SOUND DECISION</div><div class="sub">変えるのは音源だけ。Band / Grooveなし。</div></div><div class="engines"><button class="engine on" data-e="A">1 · FM</button><button class="engine" data-e="B">2 · MODEL*</button><button class="engine" data-e="C">3 · REAL PIANO</button></div></div><div class="chords" id="chords"></div><div class="status" id="status">1 · FM / A S D Fで4コード</div><section class="score"><h2>考えすぎず、今の音に1〜5</h2><div class="rows" id="rows"></div><div class="note">3 = Salamander Grand Piano V3 / velocity layer 8。コードを順番に弾いても前の音の余韻を残すように修正。原音: Alexander Holm (CC BY 3.0)。2はFAUST/WASM未接続。</div></section></main><script>const CH=[{n:'Dm9',notes:[53,57,60,64]},{n:'G13',notes:[53,59,64,69]},{n:'Cmaj9',notes:[52,59,62,67]},{n:'A7#9',notes:[55,61,63,67]}],CODES=['KeyA','KeyS','KeyD','KeyF'],KEYS=['A','S','D','F'];let ac,master,engine='A',groups=new Map(),seq=0,sampleCache=new Map(),loading=false;const $=s=>document.querySelector(s),chords=$('#chords'),status=$('#status');const SAMPLE_ROOT='https://unpkg.com/@audio-samples/piano-velocity8@1.0.5/audio/';const SAMPLE_MIDI=[48,51,54,57,60,63,66,69,72];function hz(m){return 440*Math.pow(2,(m-69)/12)}function sampleFile(m){const names={0:'C',3:'D%23',6:'F%23',9:'A'},name=names[m%12];return name+(Math.floor(m/12)-1)+'v8.ogg'}async function audio(){if(!ac){ac=new(window.AudioContext||window.webkitAudioContext)();master=ac.createDynamicsCompressor();master.threshold.value=-18;master.ratio.value=3;master.connect(ac.destination)}if(ac.state==='suspended')await ac.resume()}function newGroup(i){let id=++seq,g={id,i,voices:[]};groups.set(id,g);return g}function releaseGroup(g,fast=false){if(!ac||!g)return;let t=ac.currentTime,rel=fast?.06:.42;g.voices.forEach(v=>{try{v.g.gain.cancelScheduledValues(t);let now=Math.max(.0001,v.g.gain.value||.03);v.g.gain.setValueAtTime(now,t);v.g.gain.exponentialRampToValueAtTime(.0001,t+rel);v.nodes.forEach(n=>n.stop(t+rel+.04))}catch{}});setTimeout(()=>groups.delete(g.id),(rel+.08)*1000);document.querySelectorAll('.chord')[g.i]?.classList.remove('down')}function stopAll(){[...groups.values()].forEach(g=>releaseGroup(g,true));groups.clear();document.querySelectorAll('.chord').forEach(x=>x.classList.remove('down'))}function osc(m,t,type,vol,cut,gp){let o=ac.createOscillator(),f=ac.createBiquadFilter(),g=ac.createGain();o.type=type;o.frequency.value=hz(m);f.type='lowpass';f.frequency.value=cut;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.008);g.gain.exponentialRampToValueAtTime(vol*.38,t+.22);o.connect(f).connect(g).connect(master);o.start(t);gp.voices.push({nodes:[o],g})}function fm(m,t,idx,vol,ratio,gp){let f=hz(m),c=ac.createOscillator(),mod=ac.createOscillator(),mg=ac.createGain(),g=ac.createGain();c.frequency.value=f;mod.frequency.value=f*ratio;mg.gain.setValueAtTime(f*idx,t);mg.gain.exponentialRampToValueAtTime(f*idx*.07,t+.18);mod.connect(mg).connect(c.frequency);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.007);g.gain.exponentialRampToValueAtTime(vol*.34,t+.23);c.connect(g).connect(master);mod.start(t);c.start(t);gp.voices.push({nodes:[c,mod],g})}function nearestSample(m){return SAMPLE_MIDI.reduce((a,b)=>Math.abs(b-m)<Math.abs(a-m)?b:a)}async function loadSample(sm){if(sampleCache.has(sm))return sampleCache.get(sm);let url=SAMPLE_ROOT+sampleFile(sm),r=await fetch(url);if(!r.ok)throw new Error('HTTP '+r.status+' '+sampleFile(sm));let buf=await ac.decodeAudioData(await r.arrayBuffer());sampleCache.set(sm,buf);return buf}async function warmSamples(){if(loading)return;loading=true;status.textContent='3 · LOADING…';try{let needed=[...new Set(CH.flatMap(c=>c.notes.map(nearestSample)))];await Promise.all(needed.map(loadSample));status.textContent='3 · READY / A S D Fで4コード'}catch(e){status.textContent='3 · LOAD FAILED: '+e.message}finally{loading=false}}async function sampleNote(m,t,gp){let sm=nearestSample(m),buf=await loadSample(sm),src=ac.createBufferSource(),g=ac.createGain();src.buffer=buf;src.playbackRate.value=Math.pow(2,(m-sm)/12);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.10,t+.006);src.connect(g).connect(master);src.start(t);gp.voices.push({nodes:[src],g})}async function play(i){await audio();let gp=newGroup(i),t=ac.currentTime+.02;document.querySelectorAll('.chord')[i].classList.add('down');if(engine==='C'){try{await Promise.all(CH[i].notes.map((m,n)=>sampleNote(m,t+n*.005,gp)));status.textContent='3 · REAL PIANO'}catch(e){status.textContent='3 · LOAD FAILED: '+e.message}return}CH[i].notes.forEach((m,n)=>{let tt=t+n*.005;if(engine==='A'){fm(m,tt,2.4,.035,1,gp);fm(m,tt,.55,.014,.5,gp)}else{osc(m,tt,'triangle',.035,4200,gp);osc(m+12,tt,'sine',.006,6500,gp)}});return gp}function latestFor(i){return[...groups.values()].reverse().find(g=>g.i===i)}function releaseIndex(i){let g=latestFor(i);if(g)releaseGroup(g,false)}async function setEngine(e){stopAll();engine=e;document.querySelectorAll('.engine').forEach(b=>b.classList.toggle('on',b.dataset.e===e));status.textContent=e==='A'?'1 · FM / A S D Fで4コード':e==='B'?'2 · MODEL placeholder / A S D Fで4コード':'3 · PREPARING…';if(e==='C'){await audio();warmSamples()}}document.querySelectorAll('.engine').forEach(b=>b.onclick=()=>setEngine(b.dataset.e));chords.replaceChildren(...CH.map((c,i)=>{let b=document.createElement('button');b.className='chord';b.innerHTML='<div class="name">'+c.n+'</div><div class="key">'+KEYS[i]+'</div>';b.onpointerdown=e=>{e.preventDefault();play(i)};b.onpointerup=()=>releaseIndex(i);b.onpointercancel=()=>releaseIndex(i);return b}));document.addEventListener('keydown',e=>{if(e.repeat)return;if(['Digit1','Digit2','Digit3'].includes(e.code)){setEngine(['A','B','C'][+e.code.slice(-1)-1]);return}let i=CODES.indexOf(e.code);if(i>=0){e.preventDefault();play(i)}});document.addEventListener('keyup',e=>{let i=CODES.indexOf(e.code);if(i>=0)releaseIndex(i)});const criteria=['本物っぽい','Jazzっぽい','押した瞬間が気持ちいい','もう一度押したい'];const rows=$('#rows');criteria.forEach(c=>{let l=document.createElement('div');l.textContent=c;rows.appendChild(l);for(let i=1;i<=5;i++){let b=document.createElement('button');b.textContent=i;b.onclick=()=>{document.querySelectorAll('[data-criterion="'+c+'"]').forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};b.dataset.criterion=c;rows.appendChild(b)}});</script></body></html>
